<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Widget Wall</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
    </style>
</head>
<body class="bg-gray-50 min-h-screen">

    <header class="bg-white shadow-sm sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-4 py-4 flex items-center justify-between">
            <h1 class="text-2xl font-bold text-gray-900">My Widget Wall</h1>
            <button onclick="document.getElementById('modal').classList.remove('hidden')" class="bg-blue-600 text-white px-4 py-2 rounded-lg hover:bg-blue-700 transition">
                + Add Widget
            </button>
        </div>
    </header>

    <main class="max-w-7xl mx-auto p-4">
        <div id="widgetGrid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
            <!-- Widgets injected here -->
        </div>
    </main>

    <div id="modal" class="fixed inset-0 bg-gray-900 bg-opacity-50 hidden flex items-center justify-center z-50">
        <div class="bg-white p-6 rounded-2xl shadow-xl w-full max-w-md">
            <h2 class="text-xl font-semibold mb-4">Add New Widget</h2>
            <input id="wUrl" type="text" placeholder="Iframe URL (https://...)" class="w-full p-2 border rounded mb-3">
            <div class="flex gap-2">
                <input id="wWidth" type="number" placeholder="Width (px)" class="w-1/2 p-2 border rounded">
                <input id="wHeight" type="number" placeholder="Height (px)" class="w-1/2 p-2 border rounded">
            </div>
            <div class="mt-6 flex justify-end gap-2">
                <button onclick="document.getElementById('modal').classList.add('hidden')" class="px-4 py-2 text-gray-600">Cancel</button>
                <button onclick="saveWidget()" class="px-4 py-2 bg-blue-600 text-white rounded-lg">Add to Wall</button>
            </div>
        </div>
    </div>

    <script>
        let widgets = JSON.parse(localStorage.getItem('myWidgets') || '[]');

        function render() {
            const grid = document.getElementById('widgetGrid');
            grid.innerHTML = '';
            widgets.forEach((w, index) => {
                const card = document.createElement('div');
                card.className = 'bg-white p-4 rounded-2xl shadow-sm border border-gray-100 flex flex-col items-center';
                card.innerHTML = `
                    <div class="w-full overflow-auto mb-3" style="width: ${w.width}px; height: ${w.height}px;">
                        <iframe src="${w.url}" class="w-full h-full border-0"></iframe>
                    </div>
                    <button onclick="removeWidget(${index})" class="text-red-500 text-sm hover:underline">Remove Widget</button>
                `;
                grid.appendChild(card);
            });
        }

        function saveWidget() {
            const url = document.getElementById('wUrl').value;
            const width = document.getElementById('wWidth').value || 300;
            const height = document.getElementById('wHeight').value || 300;
            
            if (!url) return;
            widgets.push({ url, width, height });
            localStorage.setItem('myWidgets', JSON.stringify(widgets));
            document.getElementById('modal').classList.add('hidden');
            render();
        }

        function removeWidget(index) {
            widgets.splice(index, 1);
            localStorage.setItem('myWidgets', JSON.stringify(widgets));
            render();
        }

        render();
    </script>
</body>
</html>
