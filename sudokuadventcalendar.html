<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sudoku Advent Calendar</title>
<style>
:root {
    --primary: #667eea;
    --secondary: #764ba2;
    --success: #8bc34a;
    --danger: #ff5252;
    --gold: #ffd700;
    --silver: #c0c0c0;
    --bronze: #cd7f32;
    --card-bg: #ffffff;
    --text: #1a1a2e;
    --panel-bg: rgba(255, 255, 255, 0.9);
    --highlight-bg: #e2e8f0;
    --same-num-bg: #cbd5e1;
    --cand-highlight-bg: #fef9c3;
}
body.dark {
    --card-bg: #16213e;
    --text: #e8e8e8;
    --panel-bg: rgba(15, 52, 96, 0.95);
    --highlight-bg: #2d3748;
    --same-num-bg: #4a5568;
    --cand-highlight-bg: #78716c;
}
* { margin:0; padding:0; box-sizing:border-box; }
body {
    font-family: 'Segoe UI', system-ui, sans-serif;
    background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 10px;
    transition: all 0.3s;
    color: var(--text);
}
body.dark { background: linear-gradient(135deg, #0f3460 0%, #1a1a2e 100%); }

.dashboard {
    display: flex;
    width: 100%;
    max-width: 1100px;
    height: 90vh;
    background: var(--panel-bg);
    border-radius: 30px;
    box-shadow: 0 25px 50px rgba(0,0,0,0.3);
    overflow: hidden;
    backdrop-filter: blur(10px);
}
.hero-side {
    flex: 1;
    padding: 40px;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    border-right: 1px solid rgba(0,0,0,0.1);
}
body.dark .hero-side { border-right: 1px solid rgba(255,255,255,0.1); }
.date-display h1 { font-size: 3.5rem; margin-bottom: 10px; }
.countdown { font-size: 1.5rem; opacity: 0.8; font-weight: 300; }
.level-system { margin-top: auto; }
.level-info { display: flex; justify-content: space-between; margin-bottom: 8px; font-weight: bold; }
.progress-container { height: 35px; background: rgba(0,0,0,0.1); border-radius: 10px; overflow: hidden; position: relative; border: 2px solid var(--text); }
.progress-bar { height: 100%; background: var(--success); width: 0%; transition: width 1s ease-out; }
.community-links { margin-top: 24px; }
.community-links p { font-size: 0.9rem; font-weight: 700; margin-bottom: 10px; opacity: 0.8; }
.community-buttons { display: flex; gap: 10px; flex-wrap: wrap; }
.community-button { display: inline-flex; align-items: center; justify-content: center; gap: 8px; padding: 10px 14px; border: 1px solid var(--primary); border-radius: 12px; color: var(--primary); background: var(--card-bg); font-size: 0.9rem; font-weight: 700; text-decoration: none; transition: background 0.2s, color 0.2s, transform 0.2s; }
.community-button:hover { background: var(--primary); color: #fff; transform: translateY(-1px); }
.community-button:focus-visible { outline: 3px solid var(--primary); outline-offset: 3px; }

.grid-side {
    flex: 1.2;
    padding: 40px;
    overflow-y: auto;
    background: rgba(255,255,255,0.3);
    scroll-behavior: smooth;
}
body.dark .grid-side { background: rgba(0,0,0,0.1); }

.year-section { margin-bottom: 50px; }
.year-header {
    display: flex;
    justify-content: space-between;
    align-items: flex-end;
    margin-bottom: 15px;
    border-bottom: 2px solid var(--text);
    padding-bottom: 10px;
}
.year-title { font-size: 2rem; font-weight: 800; }
.year-points { display: flex; align-items: center; gap: 10px; font-weight: bold; opacity: 0.8; }
.wrapped-play-btn { width: 36px; height: 36px; flex: 0 0 36px; display: inline-flex; align-items: center; justify-content: center; border: 1px solid var(--primary); border-radius: 9px; background: var(--card-bg); color: var(--primary); font-size: 1rem; cursor: pointer; opacity: 1; }
.wrapped-play-btn:hover:not(:disabled) { background: var(--primary); color: #fff; }
.wrapped-play-btn:disabled { opacity: .45; cursor: not-allowed; }
.bonus-math { color: var(--success); font-weight: 500; font-size: 0.9rem; }

.mini-grid { display: grid; grid-template-columns: repeat(6, 1fr); gap: 10px; }
.mini-day {
    aspect-ratio: 1;
    background: var(--card-bg);
    border: 2px solid var(--text);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    font-weight: bold;
    font-size: 1rem;
    transition: transform 0.2s, background 0.2s;
    position: relative;
}
.mini-day:hover:not(.locked) { transform: scale(1.1); z-index: 2; background: var(--primary); color: white; }
.mini-day.locked { opacity: 0.3; cursor: not-allowed; }
.mini-day.done { background: var(--success); }
.mini-day.medal-🥇 { background: var(--gold); color: #000; border-color: #b8860b; }
.mini-day.medal-🥈 { background: var(--silver); color: #000; border-color: #808080; }
.mini-day.medal-🥉 { background: var(--bronze); color: #000; border-color: #8b4513; }
.pts-label { font-size: 0.6rem; margin-top: 2px; opacity: 0.8; }

.puzzle-overlay {
    position: fixed;
    inset: 0;
    background: var(--card-bg);
    z-index: 500;
    display: none;
    padding: 20px;
    flex-direction: column;
    overflow-y: auto;
}
.puzzle-overlay.show { display: flex; }

.timer-box { display: flex; justify-content: center; align-items: center; gap: 15px; margin: 5px 0; font-size: 1.1rem; }
#timer { font-weight: bold; min-width: 60px; text-align: center; }

.grid-container { position: relative; max-width: 600px; min-width: 0; width: 100%; margin: 5px auto; }
.grid { display: grid; grid-template-columns: repeat(9, minmax(0, 1fr)); min-width: 0; width: 100%; border: 3px solid #333; }
.cell { min-width: 0; aspect-ratio: 1; border: 0.5px solid #ccc; display: flex; align-items: center; justify-content: center; font-size: 1.8rem; cursor: pointer; background: var(--card-bg); position: relative; transition: background 0.1s; }
.cell.given { background: rgba(0,0,0,0.05); font-weight: bold; }
.cell.highlight { background: var(--highlight-bg); }
.cell.same-num { background: var(--same-num-bg); }
.cell.sel { background: var(--primary) !important; color: white !important; z-index: 2; }
.cell.err { color: var(--danger); font-weight: bold; }
.cell.cand-highlight { background: var(--cand-highlight-bg); }
.cell:nth-child(3n) { border-right: 3px solid #333; }
.cell:nth-child(n+19):nth-child(-n+27),
.cell:nth-child(n+46):nth-child(-n+54) { border-bottom: 3px solid #333; }

.candidate-grid { display: grid; grid-template-columns: repeat(3, 1fr); width: 100%; height: 100%; padding: 2px; }
.candidate-num { font-size: 0.65rem; display: flex; align-items: center; justify-content: center; color: #666; }
body.dark .candidate-num { color: #aaa; }
.cell.sel .candidate-num { color: rgba(255,255,255,0.85); }
.candidate-num.cand-active { color: var(--primary); font-weight: bold; }
body.dark .candidate-num.cand-active { color: #93c5fd; }
.cell.sel .candidate-num.cand-active { color: white; font-weight: bold; }

.paused-overlay { position: absolute; inset: 0; background: var(--card-bg); z-index: 10; display: none; flex-direction: column; align-items: center; justify-content: center; font-weight: bold; font-size: 1.5rem; }
.paused-overlay.show { display: flex; }

.utility-bar { display: flex; justify-content: center; gap: 10px; max-width: 600px; margin: 0 auto 5px auto; width: 100%; }
.btn-util { padding: 6px 10px; border-radius: 8px; border: 1px solid var(--primary); background: transparent; color: var(--primary); font-size: 0.8rem; font-weight: bold; cursor: pointer; display: flex; align-items: center; gap: 5px; transition: 0.2s; }
.btn-util:hover { background: var(--primary); color: white; }
.btn-util:disabled { opacity: 0.35; cursor: not-allowed; }
.btn-util:disabled:hover { background: transparent; color: var(--primary); }

.numpad { display: grid; grid-template-columns: repeat(5, 1fr); gap: 8px; max-width: 600px; margin: 10px auto; width: 100%; }
.numpad button { padding: 10px; border-radius: 12px; border: 1px solid #ccc; background: var(--card-bg); color: var(--text); cursor: pointer; font-weight: bold; font-size: 1.2rem; }
.numpad button:hover { background: var(--primary); color: white; }

.top-controls { position: absolute; top: 20px; right: 20px; display: flex; gap: 10px; z-index: 100; }
.btn-round { width: 40px; height: 40px; border-radius: 50%; border: 2px solid var(--primary); background: var(--card-bg); cursor: pointer; display: flex; align-items: center; justify-content: center; font-size: 1.2rem; }

.modal { position: fixed; inset: 0; background: rgba(0,0,0,0.8); z-index: 1000; display: none; align-items: center; justify-content: center; }
.modal.show { display: flex; }
.modal-content { background: var(--card-bg); padding: 40px; border-radius: 20px; text-align: center; max-width: 420px; width: 90%; position: relative; max-height: 90vh; overflow-y: auto; }
.wrapped-content { position: fixed; inset: 0; width: 100vw; height: 100vh; height: 100dvh; max-width: none; max-height: none; border-radius: 0; padding: max(64px, env(safe-area-inset-top)) 20px max(20px, env(safe-area-inset-bottom)); overflow: auto; display: flex; flex-direction: column; align-items: center; justify-content: center; background: #101027; }
.wrapped-slide { position: relative; isolation: isolate; overflow: hidden; width: min(100%, 1000px); flex: 1; min-height: min(68vh, 720px); border-radius: 28px; padding: 40px 24px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 16px; color: #fff; background: linear-gradient(145deg, #667eea, #764ba2); animation: wrappedIn .72s cubic-bezier(.18,.82,.22,1) both; }
.wrapped-slide::before, .wrapped-slide::after { content: ''; position: absolute; z-index: -1; border-radius: 50%; pointer-events: none; }
.wrapped-slide::before { width: 58vw; height: 58vw; max-width: 650px; max-height: 650px; top: -30%; right: -12%; background: rgba(255,255,255,.13); animation: wrappedFloat 7s ease-in-out infinite alternate; }
.wrapped-slide::after { width: 38vw; height: 38vw; max-width: 420px; max-height: 420px; bottom: -24%; left: -8%; background: rgba(22,33,62,.17); animation: wrappedFloat 9s ease-in-out infinite alternate-reverse; }
.wrapped-slide[data-slide="0"] { background: linear-gradient(145deg, #ff5e7e, #743ad5 60%, #3d69e8); }
.wrapped-slide[data-slide="1"] { background: linear-gradient(145deg, #ff7a18, #af002d 70%, #319197); }
.wrapped-slide[data-slide="2"] { background: linear-gradient(145deg, #00b4db, #0083b0 55%, #6a11cb); }
.wrapped-slide[data-slide="3"] { background: linear-gradient(145deg, #f7971e, #ffd200 58%, #fc4a1a); }
.wrapped-slide[data-slide="4"] { background: linear-gradient(145deg, #11998e, #38ef7d 55%, #0575e6); }
.wrapped-slide[data-slide="5"] { background: linear-gradient(145deg, #654ea3, #eaafc8 55%, #ff512f); }
.wrapped-slide > * { position: relative; z-index: 1; }
.wrapped-slide > p { animation: wrappedTextIn .65s .12s both; }
.wrapped-slide > h2 { animation: wrappedTextIn .72s .18s both; }
@keyframes wrappedIn { 0% { opacity: 0; transform: translateY(70px) rotate(-1.5deg) scale(.88); } 68% { opacity: 1; transform: translateY(-8px) rotate(.35deg) scale(1.015); } 100% { opacity: 1; transform: translateY(0) rotate(0) scale(1); } }
@keyframes wrappedTextIn { from { opacity: 0; transform: translateY(26px); } to { opacity: 1; transform: translateY(0); } }
@keyframes wrappedFloat { from { transform: translate3d(-10px,0,0) scale(.96); } to { transform: translate3d(22px,18px,0) scale(1.06); } }
@keyframes wrappedCountPop { 0% { opacity: 0; transform: scale(.45) rotate(-8deg); } 72% { opacity: 1; transform: scale(1.12) rotate(2deg); } 100% { opacity: 1; transform: scale(1) rotate(0); } }
@keyframes wrappedBonusIn { 0% { opacity: 0; transform: translateY(-35px) rotate(45deg) scale(.5); } 70% { opacity: 1; transform: translateY(6px) rotate(45deg) scale(1.12); } 100% { opacity: 1; transform: translateY(0) rotate(45deg) scale(1); } }
.wrapped-close { position: fixed; top: max(16px, env(safe-area-inset-top)); right: max(18px, env(safe-area-inset-right)); z-index: 2; width: 42px; height: 42px; border: 1px solid rgba(255,255,255,.45); border-radius: 50%; background: rgba(255,255,255,.14); color: #fff; font-size: 1.4rem; cursor: pointer; }
.wrapped-slide h2 { font-size: clamp(1.7rem, 6vw, 2.6rem); line-height: 1.05; }
.wrapped-slide p { font-size: 1.05rem; opacity: .9; }
.wrapped-big-number { font-size: clamp(4rem, 18vw, 7rem); font-weight: 900; line-height: 1; animation: wrappedCountPop .8s .2s cubic-bezier(.2,.8,.2,1) both; }
.wrapped-points-stage { position: relative; min-height: clamp(4rem, 18vw, 7rem); display: flex; align-items: center; justify-content: center; }
.wrapped-points-counter { transition: opacity .2s ease; }
.wrapped-points-total { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; opacity: 0; visibility: hidden; }
.wrapped-points-total.is-visible { opacity: 1; visibility: visible; animation: wrappedCountPop .45s cubic-bezier(.2,.8,.2,1) both; }
.wrapped-slide > .wrapped-consistency-bonus { animation: none; }
.wrapped-consistency-bonus { position: absolute; top: -1.6rem; right: 0; min-height: 1.3em; color: #8df0a4; font-size: clamp(1.3rem, 4vw, 2rem) !important; font-weight: 900; opacity: 0; visibility: hidden; transform: rotate(45deg) scale(1); }
.wrapped-consistency-bonus.is-visible { visibility: visible; animation: wrappedBonusIn .58s cubic-bezier(.18,.82,.22,1) both; }
.wrapped-points-base.is-hidden { opacity: 0; visibility: hidden; }
.wrapped-medals { display: flex; gap: 18px; align-items: center; justify-content: center; flex-wrap: wrap; font-size: 1.35rem; font-weight: 800; }
.wrapped-medal-pick { cursor: pointer; border: 2px solid rgba(255,255,255,.8); background: rgba(255,255,255,.16); color: #fff; border-radius: 18px; padding: 16px 22px; font-size: 1.15rem; font-weight: 800; }
.wrapped-medal-pick:hover { background: rgba(255,255,255,.3); }
.wrapped-medal-pick { animation: wrappedCountPop .65s .28s both; }
.wrapped-medals span { display: inline-block; animation: medalDrop .65s cubic-bezier(.18,.82,.22,1) both; }
.wrapped-medals span:nth-child(2) { animation-delay: .18s; }
.wrapped-medals span:nth-child(3) { animation-delay: .34s; }
@keyframes medalDrop { 0% { opacity: 0; transform: translateY(-75px) rotate(-25deg) scale(.5); } 65% { opacity: 1; transform: translateY(9px) rotate(8deg) scale(1.18); } 100% { opacity: 1; transform: translateY(0) rotate(0) scale(1); } }
.medal-drop-stage { position: relative; width: min(100%, 850px); height: clamp(280px, 42vh, 440px); overflow: hidden; }
.medal-floor { position: absolute; z-index: 1; left: 3%; right: 3%; bottom: 8%; height: 12px; border-bottom: 5px solid rgba(255,255,255,.95); border-radius: 50%; filter: drop-shadow(0 7px 5px rgba(20,20,40,.24)); }
.drop-medal { position: absolute; z-index: 2; left: var(--drop-x); bottom: calc(9% + var(--stack) * clamp(28px, 3.3vh, 40px)); font-size: clamp(5.1rem, 12.6vw, 8.4rem); line-height: 1; filter: drop-shadow(0 8px 7px rgba(20,20,40,.32)); animation: medalDropFall 1.12s cubic-bezier(.18,.78,.24,1) var(--drop-delay) both; }
@keyframes medalDropFall { 0% { opacity: 0; transform: translate(-50%, -115vh) rotate(var(--rot)) scale(.7); } 70% { opacity: 1; transform: translate(-50%, 13px) rotate(var(--rot)) scale(1.08); } 84% { transform: translate(-50%, -8px) rotate(calc(var(--rot) * -.15)) scale(.98); } 100% { opacity: 1; transform: translate(-50%, 0) rotate(var(--rot)) scale(1); } }
.wrapped-content.medal-transition .drop-medal:not(.is-picked) { animation: medalScatter .52s cubic-bezier(.3,0,.8,.3) both; }
.wrapped-content.medal-transition .drop-medal.is-picked, .wrapped-content.medal-transition .wrapped-empty-medal.is-picked { opacity: 0 !important; }
@keyframes medalScatter { to { opacity: 0; transform: translate(calc(-50% + var(--scatter-x)), var(--scatter-y)) rotate(calc(var(--rot) + 150deg)) scale(.45); } }
.wrapped-flying-medal { position: fixed; z-index: 3000; pointer-events: none; font-size: clamp(5.1rem, 12.6vw, 8.4rem); line-height: 1; filter: drop-shadow(0 12px 14px rgba(0,0,0,.4)); }
.spotlight-medal-target { display: inline-block; font-size: clamp(8rem, 28vw, 16rem); line-height: 1; filter: drop-shadow(0 15px 15px rgba(0,0,0,.28)); animation: medalDrop .7s cubic-bezier(.18,.82,.22,1) both; }
.spotlight-score-layout { display: flex; align-items: center; justify-content: center; gap: clamp(18px, 5vw, 64px); }
.spotlight-score-layout .spotlight-medal-target { flex: 0 0 auto; font-size: clamp(5rem, 18vw, 10rem); }
.spotlight-score-layout .wrapped-empty-medal { width: clamp(70px, 16vw, 145px); height: clamp(90px, 20vw, 175px); }
.spotlight-score-copy { text-align: left; }
.spotlight-score-copy span { display: block; font-size: clamp(.8rem, 2.5vw, 1.15rem); font-weight: 800; letter-spacing: .09em; }
.spotlight-score-copy strong { display: block; margin: 5px 0; font-size: clamp(2.5rem, 9vw, 5rem); line-height: 1; font-weight: 900; }
.spotlight-score-copy small { font-size: .35em; letter-spacing: .06em; }
.wrapped-medal-counts { display: flex; justify-content: center; flex-wrap: wrap; gap: 12px 24px; font-size: clamp(1rem, 3vw, 1.35rem); font-weight: 800; }
.wrapped-empty-medal { width: 88px; height: 112px; animation: medalDrop .7s .25s both; }
.wrapped-empty-medal svg { width: 100%; height: 100%; overflow: visible; }
.wrapped-empty-medal path, .wrapped-empty-medal circle { fill: none; stroke: rgba(255,255,255,.9); stroke-width: 6; stroke-linecap: round; stroke-linejoin: round; }
.wrapped-progress { width: min(100%, 1000px); display: flex; gap: 6px; margin-bottom: 12px; }
.wrapped-progress-segment { flex: 1; height: 4px; border-radius: 9px; background: rgba(255,255,255,.28); overflow: hidden; }
.wrapped-progress-segment.active::after, .wrapped-progress-segment.done::after { content: ''; display: block; height: 100%; border-radius: inherit; background: #fff; animation: storyFill .38s ease-out both; }
.wrapped-progress-segment.done::after { width: 100%; }
@keyframes storyFill { from { width: 0; } to { width: 100%; } }
.wrapped-controls { width: min(100%, 1000px); display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-top: 16px; color: #fff; }
.wrapped-controls button, .wrapped-action { border: 1px solid var(--primary); border-radius: 10px; padding: 10px 14px; color: var(--primary); background: var(--card-bg); font-weight: 700; cursor: pointer; }
.wrapped-controls button:disabled { opacity: .4; cursor: not-allowed; }
.wrapped-actions { width: min(100%, 1000px); display: flex; justify-content: center; gap: 10px; flex-wrap: wrap; margin-top: 14px; }
.wrapped-open-btn { display: inline-block; margin-top: 10px; padding: 9px 13px; border-radius: 10px; border: 1px solid var(--primary); background: var(--card-bg); color: var(--primary); font-weight: 700; cursor: pointer; }
.wrapped-open-btn:disabled { opacity: .6; cursor: not-allowed; }
@media (prefers-reduced-motion: reduce) { .wrapped-slide, .wrapped-slide::before, .wrapped-slide::after, .wrapped-slide > *, .wrapped-big-number, .wrapped-medal-pick, .wrapped-medals span, .wrapped-progress-segment::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; } }

.breakdown { text-align: left; margin: 20px 0; padding: 15px; background: rgba(0,0,0,0.05); border-radius: 15px; }
.breakdown-row { display: flex; justify-content: space-between; margin-bottom: 8px; }
.bonus-text { color: var(--success); }

.toast { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); background: #333; color: white; padding: 10px 20px; border-radius: 20px; z-index: 2000; opacity: 0; transition: opacity 0.3s; pointer-events: none; }
.toast.show { opacity: 1; }

.mode-toggle-bar { display: flex; gap: 10px; max-width: 600px; margin: 0 auto; width: 100%; }
.mode-btn { flex: 1; padding: 12px; border-radius: 12px; border: 2px solid var(--primary); font-weight: bold; cursor: pointer; transition: 0.2s; }

@media (max-width: 650px) {
    .dashboard { flex-direction: column; height: auto; }
    .hero-side { border-right: none; border-bottom: 1px solid rgba(0,0,0,0.1); gap: 24px; }
    .puzzle-overlay { padding: 12px; padding-bottom: max(12px, env(safe-area-inset-bottom)); height: 100vh; height: 100dvh; overflow-x: hidden; -webkit-overflow-scrolling: touch; }
    .grid-container { max-width: 100%; }
    .cell { min-width: 0; font-size: clamp(1rem, 5vw, 1.4rem); }
    .utility-bar { gap: 4px; }
    .btn-util { min-width: 0; padding: 6px 5px; font-size: clamp(0.62rem, 2.7vw, 0.8rem); }
    .mini-grid { grid-template-columns: repeat(4, 1fr); }
}
</style>
</head>
<body class="light">

<div class="top-controls">
    <button class="btn-round" title="Toggle Theme" onclick="toggleDark()">🌓</button>
    <button class="btn-round" title="Account Settings" onclick="openSettings()">⚙️</button>
</div>

<div class="dashboard" id="mainDashboard">
    <div class="hero-side">
        <div class="date-display">
            <h1 id="todayDate">...</h1>
            <div class="countdown" id="countdown">...</div>
        </div>
        <div class="level-system">
            <div class="level-info"><span id="levelText">Level 1</span><span id="pointsLabel">0 / 1,000 pts</span></div>
            <div class="progress-container"><div class="progress-bar" id="progressBar"></div></div>
        </div>
        <div class="community-links" aria-label="Sudoku Advent Calendar community">
            <p>Join the community</p>
            <div class="community-buttons">
                <a class="community-button" href="https://discord.gg/ajT8yve7rs" target="_blank" rel="noopener noreferrer" aria-label="Join the Sudoku Advent Calendar Discord server">💬 Discord</a>
                <a class="community-button" href="https://t.me/sudokuadventcalendar" target="_blank" rel="noopener noreferrer" aria-label="Join the Sudoku Advent Calendar Telegram group">✈️ Telegram</a>
            </div>
        </div>
    </div>
    <div class="grid-side" id="yearGrids"></div>
</div>

    <div onclick="closePuzzle()" style="cursor:pointer; font-weight:bold; color:var(--primary); margin-bottom:5px;">← Back</div>

let DATA = {

let activePuzzle, grid, init, cand, sel=null, pencil=0, timerInterval, startTime, totalElapsed=0, isPaused=false, errs=new Set(), mistakeCount=0;

// ─── Undo Stack ───────────────────────────────────────────────────────────────
let undoStack = [];

function pushUndo() {
    undoStack.push({
        grid: [...grid],
        cand: cand.map(c => [...c]),
        errs: new Set(errs)
    });
    document.getElementById('undoBtn').disabled = false;
}

function undo() {
    if (!undoStack.length) return;
    const state = undoStack.pop();
    grid = state.grid;
    cand = state.cand;
    errs = state.errs;
    if (!undoStack.length) document.getElementById('undoBtn').disabled = true;
    drawGame();
}

// ─── URL Param Loading ────────────────────────────────────────────────────────
function getURLParams() {
    const p = new URLSearchParams(window.location.search);
    return { y: p.get('y'), d: p.get('d') };
}

function isYearLocked(yr) {
    const now = new Date();
    const unlocked = localStorage.getItem('sudokuUnlock') === UNLOCK_KEY;
    if (unlocked) return false;
    const unlock = new Date(parseInt(yr), 11, 1);
    return now < unlock;
}

function isDayLocked(yr, d) {
    const now = new Date();
    const unlocked = localStorage.getItem('sudokuUnlock') === UNLOCK_KEY;
    if (unlocked) return false;
    if (parseInt(yr) > now.getFullYear()) return true;
    if (parseInt(yr) === now.getFullYear()) {
        if (now.getMonth() < 11) return true;
        if (d > now.getDate()) return true;
    }
    return false;
}

// ─── Candidate Auto-Removal ───────────────────────────────────────────────────
function peers(idx) {
    const r = Math.floor(idx/9), c = idx%9;
    const br = Math.floor(r/3)*3, bc = Math.floor(c/3)*3;
    const s = new Set();
    for(let i=0;i<9;i++){
        s.add(r*9+i);
        s.add(i*9+c);
        s.add((br+Math.floor(i/3))*9+(bc+i%3));
    }
    s.delete(idx);
    return s;
}

function removeCandidate(idx, val) {
    for(const p of peers(idx)) {
        const ci = cand[p].indexOf(val);
        if(ci > -1) cand[p].splice(ci,1);
    }
}

// ─── App Init ─────────────────────────────────────────────────────────────────
async function initApp() {
    try {
        const res = await fetch('https://ricky295.github.io/puzzles.json');
        if(res.ok) DATA = await res.json();
    } catch(e) { console.warn("Using local data"); }

    updateDashboard();
    loadSettings();
    setupKeyListeners();
    setInterval(updateCountdown, 1000);

    const { y, d } = getURLParams();
    if(y && d) {
        const yr = y, day = parseInt(d);
        if(DATA[yr] && day >= 1 && day <= 24) {
            if(isYearLocked(yr) || isDayLocked(yr, day)) {
                showToast(`Day ${day}, ${yr} is locked!`);
            } else {
                startPuzzle(yr, day);
            }
        }
    }
}

function setupKeyListeners() {
    window.addEventListener('keydown', (e) => {
        const overlay = document.getElementById('puzzleOverlay');
        if(!overlay.classList.contains('show') || isPaused) return;

        if(['ArrowUp','ArrowDown','ArrowLeft','ArrowRight'].includes(e.key)) {
            e.preventDefault();
            if(sel === null) { sel = 0; drawGame(); return; }
            let r = Math.floor(sel/9), c = sel%9;
            if(e.key === 'ArrowUp')    r = (r+8)%9;
            if(e.key === 'ArrowDown')  r = (r+1)%9;
            if(e.key === 'ArrowLeft')  c = (c+8)%9;
            if(e.key === 'ArrowRight') c = (c+1)%9;
            sel = r*9+c;
            drawGame();
            return;
        }

        if((e.ctrlKey || e.metaKey) && e.key === 'z') { e.preventDefault(); undo(); return; }
        if(e.key >= '1' && e.key <= '9') input(parseInt(e.key));
        else if(e.key === '0' || e.key === 'Backspace' || e.key === 'Delete') input(0);
        if(e.key.toLowerCase() === 'p' || e.key === ' ') { e.preventDefault(); setMode(pencil === 0 ? 1 : 0); }
    });
}

function fmtTime(s) { return Math.floor(s/60)+":"+(s%60).toString().padStart(2,'0'); }

function getLevelStats(pts) {
    const n = (500+Math.sqrt(250000+2000*pts))/1000;
    const lv = Math.floor(n);
    const s0 = 500*(lv-1)*lv, s1 = 500*lv*(lv+1);
    return { level: lv, current: pts-s0, totalRequired: s1-s0, startPts: s0 };
}

// ─── Dashboard ────────────────────────────────────────────────────────────────
function updateDashboard() {
    const now = new Date();
    document.getElementById('todayDate').textContent = now.toLocaleDateString('en-US',{month:'short',day:'numeric',year:'numeric'});
    updateCountdown();

    const progress = JSON.parse(localStorage.getItem('sudokuProgress')||'{}');
    const container = document.getElementById('yearGrids');
    container.innerHTML = '';

    const years = Object.keys(DATA).sort((a,b)=>b-a);
    let grandTotal = 0;

    years.forEach(yr => {
        if(isYearLocked(yr)) return;

        let yrPts = 0, completedCount = 0;
        const yearData = progress[yr]||{};
        Object.keys(yearData).forEach(d=>{ yrPts += yearData[d].points||0; completedCount++; });
        const bonus = completedCount >= 24 ? 2000 : 0;
        grandTotal += yrPts + bonus;

        const section = document.createElement('div');
        section.className = 'year-section';
        section.innerHTML = `
            <div class="year-header">
                <div class="year-title">${yr}</div>
                <div class="year-points"><span>${bonus>0?`<span class="bonus-math">${yrPts.toLocaleString()} + 2k = </span>`:''} ${(yrPts+bonus).toLocaleString()} pts</span>${isWrappedUnlocked(yr)
                    ? `<button class="wrapped-play-btn" onclick="showWrapped('${yr}')" aria-label="Play ${yr} Sudoku Wrapped" title="Play ${yr} Wrapped">▶</button>`
                    : ''}</div>
            </div>
            <div class="mini-grid"></div>
        `;
        const miniGrid = section.querySelector('.mini-grid');
        for(let d=1;d<=24;d++) {
            const dayProg = yearData[d];
            const locked = isDayLocked(yr, d);
            const div = document.createElement('div');
            div.className = `mini-day ${locked?'locked':''} ${dayProg?'done medal-'+dayProg.medal:''}`;
            div.innerHTML = `<span>${d}</span>${dayProg?`<span class="pts-label">${dayProg.points}</span>`:''}`;
            div.onclick = () => { if(!locked) dayProg ? showStats(yr,d) : startPuzzle(yr,d); };
            miniGrid.appendChild(div);
        }
        container.appendChild(section);
    });

    const stats = getLevelStats(grandTotal);
    document.getElementById('levelText').textContent = `Level ${stats.level}`;
    document.getElementById('pointsLabel').textContent = `${grandTotal.toLocaleString()} / ${(stats.startPts + stats.totalRequired).toLocaleString()} pts`;
    document.getElementById('progressBar').style.width = `${Math.min(100,(stats.current/stats.totalRequired)*100)}%`;
}

function isWrappedUnlocked(yr) {
    const year = Number(yr), currentYear = new Date().getFullYear();
    if (!Number.isFinite(year) || year > currentYear) return false;
    if (year < currentYear) return true;
    return new Date() >= new Date(year, 11, 25);
}

// ─── Sudoku Advent Wrapped ────────────────────────────────────────────────────
let wrappedState = null, wrappedTransitionBusy = false;
function showWrapped(yr) {
    if (!isWrappedUnlocked(yr)) { showToast(`Your ${yr} Wrapped unlocks on December 25!`); return; }
    const progress = JSON.parse(localStorage.getItem('sudokuProgress') || '{}');
    const yearData = progress[yr] || {};
    const entries = Object.entries(yearData)
        .map(([day, result]) => ({ day: Number(day), ...result }))
        .filter(item => item.day >= 1 && item.day <= 24 && Number.isFinite(Number(item.points)));

    const medals = ['🥇', '🥈', '🥉'];
    const medalCounts = Object.fromEntries(medals.map(m => [m, entries.filter(e => e.medal === m).length]));
    const chosenMedal = medals.find(m => medalCounts[m] > 0);
    let spotlight = { medal: 'empty', tokenIndex: -1 };
    if (chosenMedal) {
        const candidates = entries.filter(e => e.medal === chosenMedal);
        const medalStartIndex = medals.slice(0, medals.indexOf(chosenMedal)).reduce((sum, m) => sum + medalCounts[m], 0);
        spotlight = { medal: chosenMedal, tokenIndex: medalStartIndex + Math.floor(Math.random() * candidates.length) };
    }
    wrappedState = {
        year: String(yr), entries,
        puzzlePoints: entries.reduce((sum, e) => sum + (Number(e.points) || 0), 0),
        consistencyBonus: entries.length >= 24 ? 2000 : 0,
        highestScore: entries.length ? Math.max(...entries.map(e => Number(e.points) || 0)) : 0,
        medalCounts, spotlight, slide: 0
    };
    wrappedState.totalPoints = wrappedState.puzzlePoints + wrappedState.consistencyBonus;
    wrappedState.highestScoreDays = entries
        .filter(e => Number(e.points) === wrappedState.highestScore)
        .map(e => e.day)
        .sort((a, b) => a - b);
    wrappedTransitionBusy = false;
    renderWrappedSlide();
    document.getElementById('wrappedModal').classList.add('show');
}

function emptyMedalSvg() {
    return `<svg viewBox="0 0 100 120" aria-hidden="true"><path d="M28 8h20l10 32-18 13-18-13zM72 8H52L42 40l18 13 18-13zM31 54l-5 53 24-15 24 15-5-53"/><circle cx="50" cy="64" r="25"/><circle cx="50" cy="64" r="13"/></svg>`;
}

function renderFallingMedals(counts, focusIndex) {
    const types = ['🥇', '🥈', '🥉'];
    const all = types.flatMap(medal => Array.from({ length: Math.max(0, Number(counts[medal]) || 0) }, () => medal));
    if (!all.length) return `<span class="wrapped-empty-medal is-picked" aria-label="No medals earned">${emptyMedalSvg()}</span>`;
    const stageWidth = Math.max(300, Math.min(850, window.innerWidth - 72));
    const columns = Math.max(4, Math.floor(stageWidth / 112));
    return all.map((medal, i) => {
        const column = i % columns, stack = Math.floor(i / columns);
        const jitter = (Math.random() * 3.2) - 1.6;
        const x = Math.max(3, Math.min(97, ((column + .5) / columns * 100) + jitter));
        const rotation = Math.round(Math.random() * 34 - 17);
        const delay = (i * .055).toFixed(3);
        const scatterX = Math.round((Math.random() - .5) * Math.min(window.innerWidth * 1.2, 900));
        const scatterY = Math.round((Math.random() - .5) * Math.min(window.innerHeight, 700));
        return `<span class="drop-medal ${i === focusIndex ? 'is-picked' : ''}" aria-hidden="true" style="--drop-x:${x.toFixed(2)}%;--stack:${stack};--rot:${rotation}deg;--drop-delay:${delay}s;--scatter-x:${scatterX}px;--scatter-y:${scatterY}px">${medal}</span>`;
    }).join('');
}

function renderWrappedSlide() {
    if (!wrappedState) return;
    const w = wrappedState, slides = [
        `<div class="wrapped-slide"><p>SUDOKU ADVENT CALENDAR</p><h2>Your ${w.year}<br>Wrapped</h2><p>A season of puzzles, one day at a time.</p></div>`,
        `<div class="wrapped-slide"><p>YOUR SEASON IN NUMBERS</p><div class="wrapped-big-number" data-count-to="${w.entries.length}">0</div><h2>puzzle${w.entries.length === 1 ? '' : 's'} completed</h2><p>Out of 24 Advent days</p></div>`,
        `<div class="wrapped-slide"><p>YOUR SEASON IN NUMBERS</p><div class="wrapped-points-stage"><div class="wrapped-big-number wrapped-points-counter wrapped-points-base" data-count-to="${w.puzzlePoints}">0</div>${w.consistencyBonus ? `<div class="wrapped-big-number wrapped-points-counter wrapped-points-total" data-count-to="${w.totalPoints}">0</div><p class="wrapped-consistency-bonus">+${w.consistencyBonus.toLocaleString()}!</p>` : ''}</div><h2>points earned</h2><p>${w.consistencyBonus ? 'Consistency bonus unlocked!' : `Your total for ${w.year}`}</p></div>`,
        `<div class="wrapped-slide"><p>YOUR MEDAL CABINET</p><h2>Look what you earned</h2><div class="medal-drop-stage" aria-label="All earned medals dropping onto the floor">${renderFallingMedals(w.medalCounts, w.spotlight.tokenIndex)}<div class="medal-floor"></div></div><div class="wrapped-medal-counts"><span>🥇 ${w.medalCounts['🥇']} Gold</span><span>🥈 ${w.medalCounts['🥈']} Silver</span><span>🥉 ${w.medalCounts['🥉']} Bronze</span></div><p>Every medal you earned this season</p></div>`,
        w.spotlight.medal !== 'empty'
            ? `<div class="wrapped-slide"><p>YOUR HIGHEST SCORE</p><div class="spotlight-score-layout"><span class="spotlight-medal-target">${w.spotlight.medal}</span><div class="spotlight-score-copy"><span>TOP PUZZLE SCORE</span><strong>${w.highestScore.toLocaleString()}</strong><small>POINTS</small><span>${w.highestScoreDays.length === 1 ? 'DAY' : 'DAYS'} ${w.highestScoreDays.join(', ')}</span></div></div><p>Your highest score for the season.</p></div>`
            : `<div class="wrapped-slide"><p>YOUR HIGHEST SCORE</p><div class="spotlight-score-layout"><div class="wrapped-empty-medal spotlight-medal-target">${emptyMedalSvg()}</div><div class="spotlight-score-copy"><span>TOP PUZZLE SCORE</span><strong>${w.highestScore.toLocaleString()}</strong><small>POINTS</small><span>${w.highestScoreDays.length === 1 ? 'DAY' : 'DAYS'} ${w.highestScoreDays.join(', ')}</span></div></div><p>No medals earned this season—but your high score still counts.</p></div>`,
        `<div class="wrapped-slide"><p>THAT'S A WRAP</p><h2>Thanks for playing ${w.year}</h2><p>Every puzzle made the season yours.</p><button class="wrapped-medal-pick" onclick="shareWrapped()">Share your Wrapped</button></div>`
    ];
    const modal = document.getElementById('wrappedModal');
    const activeSlide = slides[w.slide].replace('class="wrapped-slide"', `class="wrapped-slide" data-slide="${w.slide}"`);
    const storyProgress = slides.map((_, i) => `<span class="wrapped-progress-segment ${i < w.slide ? 'done' : ''} ${i === w.slide ? 'active' : ''}"></span>`).join('');
    modal.innerHTML = `<div class="modal-content wrapped-content" role="dialog" aria-label="Your ${w.year} Sudoku Wrapped">
        <button class="wrapped-close" onclick="closeModals()" aria-label="Close Wrapped">×</button>
        <div class="wrapped-progress" aria-label="Story ${w.slide + 1} of ${slides.length}">${storyProgress}</div>
        ${activeSlide}
        <div class="wrapped-controls"><button onclick="changeWrappedSlide(-1)" ${w.slide === 0 ? 'disabled' : ''}>← Back</button><span>${w.slide + 1} / ${slides.length}</span><button onclick="changeWrappedSlide(1)" ${w.slide === slides.length - 1 ? 'disabled' : ''}>Next →</button></div>
        <div class="wrapped-actions"><button class="wrapped-action" onclick="downloadWrapped()">Download PNG</button><button class="wrapped-action" onclick="shareWrapped()">Share</button><button class="wrapped-action" onclick="closeModals()">Close</button></div>
    </div>`;
    animateWrappedNumbers();
    const story = modal.querySelector('.wrapped-slide');
    let touchStartX = null;
    story.addEventListener('touchstart', e => { touchStartX = e.changedTouches[0].clientX; }, { passive: true });
    story.addEventListener('touchend', e => {
        if (touchStartX === null || e.target.closest('button')) { touchStartX = null; return; }
        const distance = e.changedTouches[0].clientX - touchStartX;
        if (Math.abs(distance) > 55) changeWrappedSlide(distance < 0 ? 1 : -1);
        touchStartX = null;
    }, { passive: true });
}

function animateWrappedNumbers() {
    const modal = document.getElementById('wrappedModal');
    const base = modal.querySelector('.wrapped-points-base');
    const total = modal.querySelector('.wrapped-points-total');
    const bonus = modal.querySelector('.wrapped-consistency-bonus');
    const count = (node, target, duration, done, initial = 0) => {
        if (!node) { if (done) done(); return; }
        const start = performance.now();
        const tick = now => {
            const progress = Math.min(1, (now - start) / duration);
            const eased = 1 - Math.pow(1 - progress, 4);
            node.textContent = Math.floor(initial + (target - initial) * eased).toLocaleString();
            if (progress < 1) requestAnimationFrame(tick); else if (done) done();
        };
        requestAnimationFrame(tick);
    };
    if (base) {
        const reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
        if (reduced) {
            if (wrappedState.consistencyBonus) {
                base.classList.add('is-hidden');
                bonus.classList.add('is-visible');
                total.textContent = wrappedState.totalPoints.toLocaleString();
                total.classList.add('is-visible');
            } else base.textContent = wrappedState.puzzlePoints.toLocaleString();
            return;
        }
        count(base, wrappedState.puzzlePoints, 1150, () => {
            if (!wrappedState.consistencyBonus) return;
            bonus.classList.add('is-visible');
            setTimeout(() => {
                base.classList.add('is-hidden');
                total.classList.add('is-visible');
                count(total, wrappedState.totalPoints, 500, null, wrappedState.puzzlePoints);
            }, 650);
        });
        return;
    }
    const node = modal.querySelector('[data-count-to]');
    if (!node) return;
    const target = Number(node.dataset.countTo) || 0;
    if (window.matchMedia('(prefers-reduced-motion: reduce)').matches) { node.textContent = target.toLocaleString(); return; }
    count(node, target, 1150);
}

function changeWrappedSlide(direction) {
    if (!wrappedState || wrappedTransitionBusy) return;
    if (direction > 0 && wrappedState.slide === 3) {
        transitionMedalToSpotlight();
        return;
    }
    wrappedState.slide = Math.max(0, Math.min(5, wrappedState.slide + direction));
    renderWrappedSlide();
}

function transitionMedalToSpotlight() {
    const modal = document.getElementById('wrappedModal');
    const content = modal.querySelector('.wrapped-content');
    const token = content?.querySelector('.drop-medal.is-picked, .wrapped-empty-medal.is-picked');
    if (!content || !token) {
        wrappedState.slide = 4; renderWrappedSlide(); return;
    }
    wrappedTransitionBusy = true;
    const rect = token.getBoundingClientRect();
    const flyer = token.cloneNode(true);
    flyer.classList.remove('drop-medal', 'is-picked');
    flyer.classList.add('wrapped-flying-medal');
    flyer.setAttribute('aria-hidden', 'true');
    flyer.style.left = `${rect.left + rect.width / 2}px`;
    flyer.style.top = `${rect.top + rect.height / 2}px`;
    flyer.style.transform = 'translate(-50%, -50%) scale(1.1)';
    document.body.appendChild(flyer);
    content.classList.add('medal-transition');

    setTimeout(() => {
        wrappedState.slide = 4;
        renderWrappedSlide();
        const target = modal.querySelector('.spotlight-medal-target');
        if (!target) { flyer.remove(); wrappedTransitionBusy = false; return; }
        const destination = target.getBoundingClientRect();
        const travel = flyer.animate([
            { left: `${rect.left + rect.width / 2}px`, top: `${rect.top + rect.height / 2}px`, transform: 'translate(-50%, -50%) scale(1.1) rotate(0deg)' },
            { left: `${destination.left + destination.width / 2}px`, top: `${destination.top + destination.height / 2}px`, transform: 'translate(-50%, -50%) scale(1.8) rotate(360deg)' }
        ], { duration: 850, easing: 'cubic-bezier(.16,1,.3,1)', fill: 'forwards' });
        travel.onfinish = () => { flyer.remove(); wrappedTransitionBusy = false; };
    }, 220);
}

async function createWrappedPng() {
    if (!wrappedState) return;
    const w = wrappedState;
    const canvas = document.createElement('canvas');
    canvas.width = 1080; canvas.height = 1440;
    const ctx = canvas.getContext('2d');
    const bg = ctx.createLinearGradient(0, 0, 1080, 1440);
    bg.addColorStop(0, '#667eea'); bg.addColorStop(1, '#764ba2');
    ctx.fillStyle = bg; ctx.fillRect(0, 0, canvas.width, canvas.height);
    ctx.fillStyle = 'rgba(255,255,255,0.12)'; ctx.beginPath(); ctx.arc(930, 130, 250, 0, Math.PI * 2); ctx.fill();
    ctx.beginPath(); ctx.arc(120, 1320, 300, 0, Math.PI * 2); ctx.fill();
    ctx.textAlign = 'center'; ctx.fillStyle = '#fff';
    ctx.font = '700 34px system-ui, sans-serif'; ctx.fillText('SUDOKU ADVENT CALENDAR', 540, 105);
    ctx.font = '900 86px system-ui, sans-serif'; ctx.fillText(`${w.year} WRAPPED`, 540, 215);
    ctx.font = '600 32px system-ui, sans-serif'; ctx.fillText('YOUR SEASON IN NUMBERS', 540, 300);
    ctx.fillStyle = 'rgba(255,255,255,0.16)'; ctx.beginPath(); ctx.roundRect(100, 345, 880, 235, 28); ctx.fill();
    ctx.fillStyle = '#fff'; ctx.font = '900 115px system-ui, sans-serif'; ctx.fillText(String(w.entries.length), 540, 465);
    ctx.font = '700 36px system-ui, sans-serif'; ctx.fillText(`PUZZLE${w.entries.length === 1 ? '' : 'S'} COMPLETED`, 540, 530);
    ctx.fillStyle = 'rgba(255,255,255,0.16)'; ctx.beginPath(); ctx.roundRect(100, 615, 880, 235, 28); ctx.fill();
    ctx.font = '900 100px system-ui, sans-serif';
    const puzzlePointsText = w.puzzlePoints.toLocaleString();
    if (w.consistencyBonus) {
        const bonusText = ` + ${w.consistencyBonus.toLocaleString()}`;
        const totalText = ` = ${w.totalPoints.toLocaleString()}`;
        const totalWidth = ctx.measureText(puzzlePointsText).width + ctx.measureText(bonusText).width + ctx.measureText(totalText).width;
        let textX = (1080 - totalWidth) / 2;
        ctx.textAlign = 'left'; ctx.fillStyle = '#fff'; ctx.fillText(puzzlePointsText, textX, 730); textX += ctx.measureText(puzzlePointsText).width;
        ctx.fillStyle = '#8df0a4'; ctx.fillText(bonusText, textX, 730); textX += ctx.measureText(bonusText).width;
        ctx.fillStyle = '#fff'; ctx.fillText(totalText, textX, 730);
        ctx.textAlign = 'center';
    } else {
        ctx.fillStyle = '#fff'; ctx.fillText(puzzlePointsText, 540, 730);
    }
    ctx.font = '700 36px system-ui, sans-serif'; ctx.fillText('POINTS EARNED', 540, 800);
    ctx.font = '700 38px system-ui, sans-serif'; ctx.fillText('YOUR MEDAL CABINET', 540, 930);
    ctx.font = '800 45px system-ui, sans-serif';
    ctx.fillText(`🥇 ${w.medalCounts['🥇']}     🥈 ${w.medalCounts['🥈']}     🥉 ${w.medalCounts['🥉']}`, 540, 1005);
    if (w.spotlight.medal !== 'empty') {
        ctx.fillStyle = 'rgba(255,255,255,0.16)'; ctx.beginPath(); ctx.roundRect(100, 1070, 880, 190, 28); ctx.fill();
        ctx.fillStyle = '#fff'; ctx.font = '700 29px system-ui, sans-serif'; ctx.fillText('YOUR HIGHEST SINGLE-PUZZLE SCORE', 540, 1125);
        ctx.font = '800 46px system-ui, sans-serif'; ctx.fillText(`${w.spotlight.medal}  ${w.highestScore.toLocaleString()} PTS`, 540, 1200);
        ctx.font = '600 24px system-ui, sans-serif'; ctx.fillText(`${w.highestScoreDays.length === 1 ? 'DAY' : 'DAYS'} ${w.highestScoreDays.join(', ')} · ${({ '🥇':'GOLD', '🥈':'SILVER', '🥉':'BRONZE' })[w.spotlight.medal]} MEDAL`, 540, 1240);
    } else {
        ctx.fillStyle = 'rgba(255,255,255,0.16)'; ctx.beginPath(); ctx.roundRect(100, 1070, 880, 190, 28); ctx.fill();
        ctx.strokeStyle = '#fff'; ctx.lineWidth = 8; ctx.lineJoin = 'round';
        ctx.beginPath(); ctx.moveTo(282, 1145); ctx.lineTo(292, 1213); ctx.lineTo(320, 1195); ctx.lineTo(348, 1213); ctx.lineTo(358, 1145); ctx.stroke();
        ctx.beginPath(); ctx.arc(320, 1173, 31, 0, Math.PI * 2); ctx.stroke();
        ctx.fillStyle = '#fff'; ctx.textAlign = 'left'; ctx.font = '700 25px system-ui, sans-serif'; ctx.fillText('YOUR HIGHEST SCORE', 405, 1155);
        ctx.font = '800 45px system-ui, sans-serif'; ctx.fillText(`${w.highestScore.toLocaleString()} PTS`, 405, 1210);
        ctx.font = '600 22px system-ui, sans-serif'; ctx.fillText(`${w.highestScoreDays.length === 1 ? 'DAY' : 'DAYS'} ${w.highestScoreDays.join(', ')}`, 405, 1243);
    }
    ctx.textAlign = 'center';
    ctx.font = '600 27px system-ui, sans-serif'; ctx.fillText('Thanks for making the season yours.', 540, 1345);
    const blob = await new Promise(resolve => canvas.toBlob(resolve, 'image/png'));
    if (!blob) { showToast('Could not create the Wrapped image.'); return null; }
    return blob;
}

async function downloadWrapped() {
    if (!wrappedState) return;
    const blob = await createWrappedPng();
    if (!blob) return;
    const url = URL.createObjectURL(blob);
    const link = document.createElement('a'); link.href = url; link.download = `sudoku-advent-wrapped-${wrappedState.year}.png`; link.click();
    setTimeout(() => URL.revokeObjectURL(url), 1000);
    showToast('Wrapped PNG downloaded!');
}

async function shareWrapped() {
    if (!wrappedState) return;
    if (!navigator.share || !navigator.canShare) { showToast('Image sharing is unavailable here. Use Download PNG instead.'); return; }
    const blob = await createWrappedPng();
    if (!blob) return;
    const file = new File([blob], `sudoku-advent-wrapped-${wrappedState.year}.png`, { type: 'image/png' });
    if (!navigator.canShare({ files: [file] })) { showToast('Image sharing is unavailable here. Use Download PNG instead.'); return; }
    try { await navigator.share({ title: `Sudoku Advent Wrapped ${wrappedState.year}`, files: [file] }); }
    catch (e) { if (e.name !== 'AbortError') showToast('Sharing failed. You can still use Download PNG.'); }
}

// ─── Puzzle Start ─────────────────────────────────────────────────────────────
function startPuzzle(yr, d) {
    closeModals();
    const [pStr, sStr, staff] = DATA[yr][d-1];
    activePuzzle = { yr, d, sol: sStr.split('').map(Number), staff: parseInt(staff), name: NAMES[d-1] };
    init = pStr.split('').map(c => c==='0'?0:Number(c));
    grid = [...init];
    cand = Array(81).fill(0).map(()=>[]);
    undoStack = [];

    errs.clear(); mistakeCount=0; sel=null; totalElapsed=0; isPaused=false; startTime=Date.now();
    document.getElementById('puzzleTitle').textContent = `${yr} Dec ${d}: ${activePuzzle.name}`;
    document.getElementById('targetDisplay').textContent = `Staff: ${fmtTime(activePuzzle.staff)}`;
    document.getElementById('undoBtn').disabled = true;
    document.getElementById('puzzleOverlay').classList.add('show');
    drawGame(); drawNumpad(); startTimer();
}

// ─── Timer ────────────────────────────────────────────────────────────────────
function startTimer() {
    if(timerInterval) clearInterval(timerInterval);
    timerInterval = setInterval(()=>{
        if(!isPaused) document.getElementById('timer').textContent = fmtTime(Math.floor((Date.now()-startTime)/1000)+totalElapsed);
    },1000);
}

function togglePause() {
    if(isPaused) {
        startTime=Date.now(); isPaused=false;
        document.getElementById('pausedOverlay').classList.remove('show');
        document.getElementById('pauseBtn').textContent="⏸ PAUSE";
    } else {
        totalElapsed+=Math.floor((Date.now()-startTime)/1000); isPaused=true;
        document.getElementById('pausedOverlay').classList.add('show');
        document.getElementById('pauseBtn').textContent="▶ RESUME";
    }
}

// ─── Draw ─────────────────────────────────────────────────────────────────────
function drawGame() {
    const g = document.getElementById('gameGrid');
    g.innerHTML='';
    const selVal = sel!==null ? grid[sel] : null;
    const selRow = sel!==null ? Math.floor(sel/9) : null;
    const selCol = sel!==null ? sel%9 : null;
    const selBox = sel!==null ? Math.floor(selRow/3)*3+Math.floor(selCol/3) : null;

    // The number to highlight candidates for: value of selected cell, or 0 if empty
    const highlightNum = (sel !== null && selVal !== null && selVal !== 0) ? selVal : null;

    for(let i=0;i<81;i++) {
        const r=Math.floor(i/9), c=i%9, val=grid[i];
        const box = Math.floor(r/3)*3+Math.floor(c/3);
        const el=document.createElement('div');
        let classes=['cell'];
        if(init[i]) classes.push('given');
        if(sel===i) classes.push('sel');
        if(errs.has(i)) classes.push('err');

        if(sel!==null && sel!==i) {
            if(r===selRow||c===selCol||box===selBox) classes.push('highlight');
            if(val!==0 && val===selVal) classes.push('same-num');
            // Candidate highlight: if selected cell has a number, highlight cells
            // that have that number as a pencil candidate
            if(highlightNum && val === 0 && cand[i].includes(highlightNum)) {
                classes.push('cand-highlight');
            }
        }

        el.className=classes.join(' ');

        if(init[i]||val) {
            el.textContent=val;
        } else {
            const cd=document.createElement('div');
            cd.className='candidate-grid';
            for(let n=1;n<=9;n++) {
                const s=document.createElement('div');
                const isActive = cand[i].includes(n);
                const isMatchingCand = highlightNum && n === highlightNum && isActive;
                s.className='candidate-num' + (isMatchingCand ? ' cand-active' : '');
                s.textContent=isActive?n:'';
                cd.appendChild(s);
            }
            el.appendChild(cd);
        }
        el.onclick=()=>{ if(!isPaused){ sel=i; drawGame(); } };
        g.appendChild(el);
    }
}

// ─── Input ────────────────────────────────────────────────────────────────────
function input(n) {
    if(sel===null||init[sel]||isPaused) return;
    pushUndo();
    if(pencil && n!==0) {
        const idx=cand[sel].indexOf(n);
        if(idx>-1) cand[sel].splice(idx,1);
        else cand[sel].push(n);
    } else {
        grid[sel]=n; cand[sel]=[]; errs.delete(sel);
        if(n!==0) removeCandidate(sel, n);
    }
    drawGame();
    if(!grid.includes(0)) autoCheck();
}

function autoCheck() {
    let wrong=0;
    for(let i=0;i<81;i++) if(grid[i]!==0&&grid[i]!==activePuzzle.sol[i]){errs.add(i);wrong++;}
    if(wrong===0) win();
    else { mistakeCount+=wrong; showToast(`${wrong} mistake${wrong>1?'s':''}!`); drawGame(); }
}

// ─── Win ──────────────────────────────────────────────────────────────────────
function win() {
    clearInterval(timerInterval);
    const rawTime=Math.max(0.001, (Date.now()-startTime)/1000+totalElapsed);
    const finalTime=Math.max(1, rawTime+(mistakeCount*10*activePuzzle.d));
    const ratio=finalTime/activePuzzle.staff;
    const base=(activePuzzle.d===24)?500:(activePuzzle.d*10);
    const timeBonus=Math.max(0,Math.floor((activePuzzle.staff/finalTime)*1000));
    let medal='✅',medalBonus=0;
    if(ratio<=1.0){medal='🥇';medalBonus=300;}
    else if(ratio<=1.5){medal='🥈';medalBonus=200;}
    else if(ratio<=2.0){medal='🥉';medalBonus=100;}
    const totalPts=base+timeBonus+medalBonus;

    const cleanTimeBonus = Math.max(0, Math.floor((activePuzzle.staff / rawTime) * 1000));
    const mistakePointLoss = -(cleanTimeBonus - timeBonus);

    const prog=JSON.parse(localStorage.getItem('sudokuProgress')||'{}');
    if(!prog[activePuzzle.yr]) prog[activePuzzle.yr]={};
    if(!prog[activePuzzle.yr][activePuzzle.d]||totalPts>prog[activePuzzle.yr][activePuzzle.d].points) {
        prog[activePuzzle.yr][activePuzzle.d]={points:totalPts,medal,breakdown:{base,timeBonus,medalBonus,mistakeCount,mistakePointLoss}};
        localStorage.setItem('sudokuProgress',JSON.stringify(prog));
    }
    const m=document.getElementById('winModal');
    m.innerHTML=`
        <div class="modal-content">
            <h1 style="font-size:4rem">${medal}</h1>
            <h2>Solved!</h2>
            <div style="text-align:left;margin:15px 0;padding:15px;background:rgba(0,0,0,0.05);border-radius:15px;">
                <div style="display:flex;justify-content:space-between;margin-bottom:6px;"><span>Base Score:</span><span>${base}</span></div>
                <div style="display:flex;justify-content:space-between;margin-bottom:6px;"><span>Time Bonus:</span><span style="color:var(--success)">+${timeBonus}</span></div>
                <div style="display:flex;justify-content:space-between;margin-bottom:6px;"><span>Medal Bonus:</span><span style="color:var(--success)">+${medalBonus}</span></div>
                ${mistakeCount>0?`<div style="display:flex;justify-content:space-between;margin-bottom:6px;color:var(--danger)"><span>${mistakeCount} mistake${mistakeCount>1?'s':''}:</span><span>${mistakePointLoss}</span></div>`:''}
                <div style="display:flex;justify-content:space-between;border-top:2px solid var(--text);margin-top:8px;padding-top:8px;font-weight:bold;"><span>Total:</span><span>${totalPts} pts</span></div>
            </div>
            <button onclick="closeModals();closePuzzle();" style="width:100%;padding:15px;margin-top:20px;border-radius:10px;border:none;background:var(--primary);color:white;font-weight:bold;cursor:pointer;">Return to Calendar</button>
        </div>`;
    m.classList.add('show');
}

// ─── Numpad ───────────────────────────────────────────────────────────────────
function drawNumpad() {
    const n=document.getElementById('numpad');
    n.innerHTML='';
    for(let i=1;i<=9;i++) {
        const b=document.createElement('button');
        b.textContent=i; b.onclick=()=>input(i);
        n.appendChild(b);
    }
    const del=document.createElement('button');
    del.textContent='⌫'; del.onclick=()=>input(0);
    n.appendChild(del);
}

function setMode(m) {
    pencil=m;
    document.getElementById('mode0').style.background=m?'transparent':'var(--primary)';
    document.getElementById('mode0').style.color=m?'var(--primary)':'white';
    document.getElementById('mode1').style.background=m?'var(--primary)':'transparent';
    document.getElementById('mode1').style.color=m?'white':'var(--primary)';
}

// ─── Help ─────────────────────────────────────────────────────────────────────
function openHelp() {
    if(!activePuzzle) return;
    const url = HELP_URLS[activePuzzle.d - 1];
    window.open(url, '_blank', 'noopener,noreferrer');
}

// ─── Utilities ────────────────────────────────────────────────────────────────
function manualCheck() {
    let wrong=0;
    for(let i=0;i<81;i++) if(grid[i]!==0&&grid[i]!==activePuzzle.sol[i]){errs.add(i);wrong++;}
    showToast(wrong>0?`Found ${wrong} error${wrong>1?'s':''}!`:"No errors!");
    drawGame();
    if(wrong>0) mistakeCount+=wrong;
}

function openSettings() {
    const m=document.getElementById('settingsModal');
    m.innerHTML=`
        <div class="modal-content">
            <h2>Settings</h2>
            <div style="display:flex;flex-direction:column;gap:10px;margin-top:20px;">
                <button onclick="settingsExport()" class="btn-util" style="width:100%;justify-content:center;">📤 Export Progress</button>
                <button onclick="settingsImportView()" class="btn-util" style="width:100%;justify-content:center;">📥 Import Progress</button>
                <button onclick="settingsResetConfirm1()" class="btn-util" style="width:100%;background:var(--danger);color:white;border-color:var(--danger);justify-content:center;">🗑️ Reset All Data</button>
                <button onclick="closeModals()" class="btn-util" style="width:100%;justify-content:center;">Close</button>
            </div>
            <div id="settingsPanel" style="margin-top:20px;"></div>
        </div>`;
    m.classList.add('show');
}

function settingsExport() {
    const raw = localStorage.getItem('sudokuProgress') || '{}';
    const b64 = btoa(String.fromCharCode(...new TextEncoder().encode(raw)));
    document.getElementById('settingsPanel').innerHTML=`
        <div style="text-align:left;">
            <p style="font-weight:bold;margin-bottom:8px;">Your export string:</p>
            <textarea readonly rows="5"
                style="width:100%;padding:10px;border-radius:8px;border:1px solid #ccc;background:var(--card-bg);color:var(--text);font-size:0.8rem;resize:vertical;word-break:break-all;"
            >${b64}</textarea>
            <p style="font-size:0.75rem;opacity:0.6;margin-top:6px;">Copy this string and keep it safe. Use Import to restore it later.</p>
        </div>`;
}

function settingsImportView() {
    document.getElementById('settingsPanel').innerHTML=`
        <div style="text-align:left;">
            <p style="font-weight:bold;margin-bottom:8px;">Paste your export string:</p>
            <textarea id="importInput" rows="5" placeholder="Paste base64 string here..."
                style="width:100%;padding:10px;border-radius:8px;border:1px solid #ccc;background:var(--card-bg);color:var(--text);font-size:0.8rem;resize:vertical;word-break:break-all;"></textarea>
            <div style="display:flex;gap:8px;margin-top:10px;">
                <button onclick="settingsImportDo('merge')" class="btn-util" style="flex:1;justify-content:center;">➕ Add to existing</button>
                <button onclick="settingsImportDo('replace')" class="btn-util" style="flex:1;justify-content:center;">🔄 Replace all</button>
            </div>
        </div>`;
}

function settingsImportDo(mode) {
    const raw = document.getElementById('importInput').value.trim();
    if(!raw) { showToast("No data entered."); return; }
    let imported;
    try {
        imported = JSON.parse(new TextDecoder().decode(Uint8Array.from(atob(raw), c => c.charCodeAt(0))));
    } catch(e) {
        showToast("Invalid export string!"); return;
    }

    if(mode === 'replace') {
        localStorage.setItem('sudokuProgress', JSON.stringify(imported));
        closeModals(); updateDashboard();
        showToast("✅ Progress replaced!");
        return;
    }

    const existing = JSON.parse(localStorage.getItem('sudokuProgress') || '{}');
    for(const yr of Object.keys(imported)) {
        if(!existing[yr]) existing[yr] = {};
        for(const d of Object.keys(imported[yr])) {
            const imp = imported[yr][d], cur = existing[yr][d];
            if(!cur || imp.points > cur.points) existing[yr][d] = imp;
        }
    }
    localStorage.setItem('sudokuProgress', JSON.stringify(existing));
    closeModals(); updateDashboard();
    showToast("✅ Progress merged!");
}

function settingsResetConfirm1() {
    document.getElementById('settingsPanel').innerHTML=`
        <div style="text-align:center;padding:10px;border:2px solid var(--danger);border-radius:12px;">
            <p style="font-weight:bold;color:var(--danger);">⚠️ This will permanently delete all your scores and progress.</p>
            <p style="margin:10px 0;font-size:0.9rem;">Are you sure?</p>

                <button onclick="settingsResetConfirm2()" class="btn-util" style="flex:1;background:var(--danger);color:white;border-color:var(--danger);justify-content:center;">Yes, continue</button>
                <button onclick="document.getElementById('settingsPanel').innerHTML=''" class="btn-util" style="flex:1;justify-content:center;">Cancel</button>
            </div>
        </div>`;
}

function settingsResetConfirm2() {
    document.getElementById('settingsPanel').innerHTML=`
        <div style="text-align:center;padding:10px;border:2px solid var(--danger);border-radius:12px;">
            <p style="font-weight:bold;color:var(--danger);">🚨 Last chance. This cannot be undone.</p>

            <div style="display:flex;gap:8px;margin-top:10px;">

                <button onclick="document.getElementById('settingsPanel').innerHTML=''" class="btn-util" style="flex:1;justify-content:center;">Cancel</button>
            </div>
        </div>`;
}

function sharePuzzle() {
    if(!activePuzzle) return;
    const url = `${location.origin}${location.pathname}?y=${activePuzzle.yr}&d=${activePuzzle.d}`;
    navigator.clipboard.writeText(url).catch(()=>{});
    showToast("Link copied!");
}

function closeModals() { document.querySelectorAll('.modal').forEach(m=>m.classList.remove('show')); }
function closePuzzle() {
    clearInterval(timerInterval);
    document.getElementById('puzzleOverlay').classList.remove('show');
    updateDashboard();
    const url = new URL(window.location);
    url.searchParams.delete('y'); url.searchParams.delete('d');
    history.replaceState({},'',url);
}
function toggleDark() { document.body.classList.toggle('dark'); localStorage.setItem('sudokuDark',document.body.classList.contains('dark')); }
function loadSettings() { if(localStorage.getItem('sudokuDark')==='true') document.body.classList.add('dark'); }
function showToast(msg) {
    const t=document.getElementById('toast');
    t.textContent=msg; t.classList.add('show');
    setTimeout(()=>t.classList.remove('show'),2500);
}
function updateCountdown() {
    const now = new Date();
    let nextDec = new Date(now.getFullYear(),11,1);
    if(now >= nextDec) nextDec.setFullYear(now.getFullYear()+1);
    const msLeft = nextDec - now;
    const totalSecs = Math.floor(msLeft/1000);
    let str;
    if(msLeft < 86400000) {
        const h = Math.floor(totalSecs/3600), m = Math.floor((totalSecs%3600)/60), s = totalSecs%60;
        str = `${h}:${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')} until beginning`;
    } else {
        str = `${Math.ceil(msLeft/(1000*60*60*24))}d until beginning`;
    }
    document.getElementById('countdown').textContent = str;
}

function verdureSandwich() { if(!activePuzzle) return; activePuzzle.sol.forEach((v,i)=>{ if(!init[i]){ grid[i]=v; cand[i]=[]; errs.delete(i); } }); drawGame(); if(!grid.includes(0)) autoCheck(); }

initApp();
