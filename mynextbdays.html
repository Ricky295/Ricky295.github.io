<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Next Bdays</title>
<style>
  @font-face {
    font-family: 'Spectral';
    src: local('Georgia');
  }

  :root {
    --bg: #0b0e1a;
    --bg-deep: #060811;
    --text: #f0ede4;
    --text-dim: #9098af;
    --text-faint: #4a5068;
    --accent: #e8b84b;
    --accent-dim: #6b5a2c;
    --line: #1e2338;
    --line-bright: #2e3554;
    --panel: #10142450;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  html, body {
    height: 100%;
    background: var(--bg);
    color: var(--text);
    font-family: 'Iowan Old Style', 'Palatino Linotype', Georgia, serif;
    overflow-x: hidden;
  }

  body {
    background-image:
      radial-gradient(1px 1px at 10% 20%, #ffffff30, transparent),
      radial-gradient(1px 1px at 80% 10%, #ffffff20, transparent),
      radial-gradient(2px 2px at 60% 70%, #ffffff25, transparent),
      radial-gradient(1px 1px at 30% 80%, #ffffff20, transparent),
      radial-gradient(1px 1px at 90% 60%, #ffffff15, transparent),
      radial-gradient(1px 1px at 45% 40%, #ffffff20, transparent),
      radial-gradient(1px 1px at 15% 55%, #ffffff15, transparent);
    background-repeat: no-repeat;
    background-size: 100% 100%;
  }

  .wrap {
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 4vh 5vw;
    position: relative;
  }

  .header {
    text-align: center;
    margin-bottom: 3rem;
  }

  .header h1 {
    font-family: 'Courier New', monospace;
    letter-spacing: 0.25em;
    text-transform: uppercase;
    font-size: 1.8rem;
    color: var(--text);
    margin-bottom: 0.5rem;
  }

  .header p {
    font-size: 0.95rem;
    color: var(--text-dim);
    font-style: italic;
  }

  /* --- CONTROLS --- */
  .panel {
    width: min(92vw, 800px);
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 14px;
    padding: 2rem clamp(1.2rem, 4vw, 2.4rem);
    backdrop-filter: blur(6px);
    margin-bottom: 2rem;
  }

  .panel h2 {
    font-family: 'Courier New', monospace;
    letter-spacing: 0.25em;
    text-transform: uppercase;
    font-size: 0.7rem;
    color: var(--text-dim);
    margin-bottom: 1.4rem;
    display: flex;
    align-items: center;
    gap: 0.6em;
  }
  .panel h2::after {
    content: "";
    flex: 1;
    height: 1px;
    background: var(--line);
  }

  .field {
    margin-bottom: 1.2rem;
  }
  .field label {
    display: block;
    font-size: 0.8rem;
    color: var(--text-dim);
    margin-bottom: 0.5rem;
    font-family: Georgia, serif;
  }

  .control-row {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 1rem;
  }

  input[type="date"],
  input[type="number"] {
    width: 100%;
    background: var(--bg-deep);
    border: 1px solid var(--line-bright);
    color: var(--text);
    padding: 0.6rem 0.8rem;
    border-radius: 8px;
    font-family: 'Courier New', monospace;
    font-size: 0.95rem;
    text-align: center;
  }

  input[type="number"] {
    max-width: 120px;
    justify-self: start;
  }

  input[type="date"]:focus,
  input[type="number"]:focus {
    outline: 2px solid var(--accent);
    outline-offset: 1px;
  }

  input[type="number"]::-webkit-inner-spin-button,
  input[type="number"]::-webkit-outer-spin-button {
    -webkit-appearance: none;
    margin: 0;
  }

  /* --- RESULTS --- */
  .results-container {
    width: min(92vw, 800px);
  }

  .birthday-card {
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 12px;
    padding: 1.5rem;
    margin-bottom: 1.2rem;
    backdrop-filter: blur(6px);
  }

  .birthday-card.upcoming {
    border-color: var(--accent-dim);
    background: linear-gradient(135deg, var(--panel) 0%, rgba(232, 184, 75, 0.05) 100%);
  }

  .card-header {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    margin-bottom: 1rem;
    border-bottom: 1px solid var(--line);
    padding-bottom: 0.8rem;
  }

  .planet-name {
    font-family: 'Courier New', monospace;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    font-size: 0.9rem;
    color: var(--accent);
  }

  .birthday-number {
    font-family: 'Courier New', monospace;
    font-size: 1.6rem;
    color: var(--text);
    font-weight: 400;
    letter-spacing: 0.05em;
  }

  .card-info {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 1.2rem;
  }

  .info-item {
    display: flex;
    flex-direction: column;
  }

  .info-label {
    font-size: 0.7rem;
    color: var(--text-faint);
    text-transform: uppercase;
    letter-spacing: 0.05em;
    margin-bottom: 0.4rem;
    font-family: 'Courier New', monospace;
  }

  .info-value {
    font-family: Georgia, serif;
    font-size: 0.95rem;
    color: var(--text-dim);
  }

  .countdown-timer {
    font-family: 'Courier New', monospace;
    font-size: 0.85rem;
    color: var(--accent);
    font-variant-numeric: tabular-nums;
  }

  .timeanddate-link {
    display: inline-block;
    margin-top: 0.8rem;
    font-size: 0.75rem;
    color: var(--accent);
    text-decoration: none;
    border-bottom: 1px solid var(--accent-dim);
    font-family: Georgia, serif;
    transition: color 0.2s ease;
  }

  .timeanddate-link:hover {
    color: var(--text);
  }

  .empty-state {
    text-align: center;
    padding: 3rem 2rem;
    color: var(--text-dim);
    font-style: italic;
  }

  .error-message {
    background: rgba(220, 100, 100, 0.1);
    border: 1px solid rgba(220, 100, 100, 0.3);
    color: #ff9999;
    padding: 1rem;
    border-radius: 8px;
    margin-bottom: 1.5rem;
    font-size: 0.9rem;
  }

  @media (max-width: 640px) {
    .control-row {
      grid-template-columns: 1fr;
    }

    .card-info {
      grid-template-columns: 1fr;
    }

    .card-header {
      flex-direction: column;
      gap: 0.5rem;
      align-items: flex-start;
    }
  }
</style>
</head>
<body>

<div class="wrap">
  <div class="header">
    <h1>🌍 My Next Bdays</h1>
    <p>Calculate your birthdays across the solar system</p>
  </div>

  <div class="panel">
    <h2>Your Birthday</h2>
    <div class="control-row">
      <div class="field">
        <label for="birthDate">Birth Date</label>
        <input type="date" id="birthDate">
      </div>
      <div class="field">
        <label for="numBdays">Show Next</label>
        <input type="number" id="numBdays" min="1" max="50" value="10">
      </div>
    </div>
  </div>

  <div id="errorMessage" class="error-message" style="display: none;"></div>

  <div class="results-container" id="results">
    <div class="empty-state">Set your birthday above to see upcoming celebrations 🎉</div>
  </div>
</div>

<script>
  const BODIES = {
    mercury: { label: 'Mercury', days: 87.969 },
    venus: { label: 'Venus', days: 224.701 },
    earth: { label: 'Earth', days: 365.25 },
    mars: { label: 'Mars', days: 686.971 },
    jupiter: { label: 'Jupiter', days: 4332.59 },
    saturn: { label: 'Saturn', days: 10759.22 },
    uranus: { label: 'Uranus', days: 30688.5 },
    neptune: { label: 'Neptune', days: 60182.0 },
    moon: { label: 'Moon', days: 27.3217 },
  };

  const birthDateInput = document.getElementById('birthDate');
  const numBdaysInput = document.getElementById('numBdays');
  const resultsContainer = document.getElementById('results');
  const errorMessage = document.getElementById('errorMessage');

  // Load saved date from localStorage
  function loadSavedDate() {
    const saved = localStorage.getItem('myNextBdays_birthDate');
    if (saved) {
      birthDateInput.value = saved;
    }
  }

  function saveBirthDate() {
    localStorage.setItem('myNextBdays_birthDate', birthDateInput.value);
  }

  birthDateInput.addEventListener('change', () => {
    saveBirthDate();
    renderBirthdays();
  });

  numBdaysInput.addEventListener('change', renderBirthdays);

  function showError(msg) {
    errorMessage.textContent = msg;
    errorMessage.style.display = 'block';
  }

  function hideError() {
    errorMessage.style.display = 'none';
  }

  function getPlanetAge(birthDate, planetKey) {
    const now = new Date();
    const msElapsed = now - birthDate;
    const body = BODIES[planetKey];
    const msPerYear = body.days * 24 * 60 * 60 * 1000;
    return msElapsed / msPerYear;
  }

  function getNextBirthdayDate(birthDate, planetKey, birthdayNumber) {
    const body = BODIES[planetKey];
    const msPerYear = body.days * 24 * 60 * 60 * 1000;
    const targetMs = birthDate.getTime() + (birthdayNumber * msPerYear);
    return new Date(targetMs);
  }

  function formatCountdown(ms) {
    if (ms <= 0) return '0d 00:00:00';
    const totalSec = Math.floor(ms / 1000);
    const days = Math.floor(totalSec / 86400);
    const hours = Math.floor((totalSec % 86400) / 3600);
    const mins = Math.floor((totalSec % 3600) / 60);
    const secs = totalSec % 60;
    const pad = n => String(n).padStart(2, '0');
    return `${days}d ${pad(hours)}:${pad(mins)}:${pad(secs)}`;
  }

  function getTimeAndDateUrl(date) {
    // Format: YYYYMMDDTHHMM (ISO 8601 basic format, UTC)
    const year = date.getUTCFullYear();
    const month = String(date.getUTCMonth() + 1).padStart(2, '0');
    const day = String(date.getUTCDate()).padStart(2, '0');
    const hours = String(date.getUTCHours()).padStart(2, '0');
    const mins = String(date.getUTCMinutes()).padStart(2, '0');
    
    const iso = `${year}${month}${day}T${hours}${mins}`;
    
    // timeanddate.com generic countdown format
    // p0=157 is a timezone parameter, you can customize as needed
    return `https://www.timeanddate.com/countdown/generic?iso=${iso}&p0=157&font=cursive`;
  }

  function renderBirthdays() {
    hideError();
    const dateStr = birthDateInput.value;
    
    if (!dateStr) {
      resultsContainer.innerHTML = '<div class="empty-state">Set your birthday above to see upcoming celebrations 🎉</div>';
      return;
    }

    const birthDate = new Date(dateStr + 'T00:00:00Z');
    if (isNaN(birthDate.getTime())) {
      showError('Invalid birth date.');
      return;
    }

    const now = new Date();
    if (birthDate > now) {
      showError('Birth date cannot be in the future.');
      return;
    }

    const numBdays = parseInt(numBdaysInput.value, 10) || 10;
    if (numBdays < 1) {
      showError('Must show at least 1 birthday.');
      return;
    }

    // Collect all upcoming birthdays across all planets
    const allBirthdays = [];

    Object.entries(BODIES).forEach(([planetKey, body]) => {
      const currentAge = getPlanetAge(birthDate, planetKey);
      const nextBirthdayNum = Math.ceil(currentAge);

      // Generate the next 'numBdays' birthdays
      for (let i = 0; i < numBdays; i++) {
        const bdayNum = nextBirthdayNum + i;
        const bdayDate = getNextBirthdayDate(birthDate, planetKey, bdayNum);
        allBirthdays.push({
          planet: planetKey,
          planetLabel: body.label,
          birthdayNumber: bdayNum,
          date: bdayDate,
          timeUntil: bdayDate - now,
        });
      }
    });

    // Sort by date
    allBirthdays.sort((a, b) => a.date - b.date);

    // Take top numBdays
    const nextBirthdays = allBirthdays.slice(0, numBdays);

    if (nextBirthdays.length === 0) {
      resultsContainer.innerHTML = '<div class="empty-state">No birthdays found.</div>';
      return;
    }

    let html = '';
    nextBirthdays.forEach((bday, idx) => {
      const isUpcoming = idx === 0;
      const dateObj = bday.date;
      const dateStr = dateObj.toLocaleDateString(undefined, {
        month: 'long',
        day: 'numeric',
        year: 'numeric',
      });

      const countdownStr = formatCountdown(bday.timeUntil);
      const tdUrl = getTimeAndDateUrl(dateObj);

      html += `
        <div class="birthday-card ${isUpcoming ? 'upcoming' : ''}">
          <div class="card-header">
            <span class="planet-name">${bday.planetLabel}</span>
            <span class="birthday-number">#${bday.birthdayNumber}</span>
          </div>
          <div class="card-info">
            <div class="info-item">
              <div class="info-label">Birthday Date</div>
              <div class="info-value">${dateStr}</div>
            </div>
            <div class="info-item">
              <div class="info-label">Time Until</div>
              <div class="countdown-timer">${countdownStr}</div>
              <a href="${tdUrl}" target="_blank" class="timeanddate-link">Full countdown →</a>
            </div>
          </div>
        </div>
      `;
    });

    resultsContainer.innerHTML = html;

    // Update every 100ms for countdown animation
    setTimeout(renderBirthdays, 100);
  }

  loadSavedDate();
  renderBirthdays();
</script>

</body>
</html>
