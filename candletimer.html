<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tealight Timer</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; }
        .candle-stage { width: min(100%, 560px, calc((100svh - 220px) * 1.36)); height: min(55svh, 480px); min-height: 220px; }
        @media (max-height: 620px) { .candle-stage { height: 34svh; min-height: 170px; width: min(100%, calc((100svh - 220px) * 1.36)); } }

        /* Flame animation */
        @keyframes flicker {
            0%, 100% {
                transform: scale(1) rotate(-1deg);
                opacity: 0.95;
                filter: drop-shadow(0 0 12px rgba(251, 191, 36, 0.8)) drop-shadow(0 0 24px rgba(245, 158, 11, 0.6));
            }
            25% {
                transform: scale(1.04, 0.96) rotate(1deg);
                opacity: 0.85;
                filter: drop-shadow(0 0 10px rgba(251, 191, 36, 0.7)) drop-shadow(0 0 20px rgba(245, 158, 11, 0.5));
            }
            50% {
                transform: scale(0.96, 1.04) rotate(-2deg);
                opacity: 1;
                filter: drop-shadow(0 0 15px rgba(251, 191, 36, 0.9)) drop-shadow(0 0 30px rgba(245, 158, 11, 0.7));
            }
            75% {
                transform: scale(1.02, 0.98) rotate(1.5deg);
                opacity: 0.9;
                filter: drop-shadow(0 0 11px rgba(251, 191, 36, 0.75)) drop-shadow(0 0 22px rgba(245, 158, 11, 0.55));
            }
        }

        @keyframes innerFlame {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(0.9, 1.1); }
        }

        .flame-active {
            animation: flicker 1.2s infinite ease-in-out;
            transform-origin: bottom center;
        }

        .inner-flame-active {
            animation: innerFlame 0.8s infinite ease-in-out;
            transform-origin: bottom center;
        }

        .smoke {
            opacity: 0;
            transition: opacity 0.5s ease-out;
        }

        .smoke.active {
            opacity: 0.6;
            animation: smokeRise 2s ease-out forwards;
        }

        @keyframes smokeRise {
            0% { transform: translateY(0) scaleX(1); opacity: 0.8; }
            100% { transform: translateY(-40px) scaleX(2.5); opacity: 0; }
        }
    </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex items-center justify-center p-3 sm:p-5">
    <main class="w-full max-w-3xl bg-slate-900 border border-slate-800 rounded-3xl p-4 sm:p-7 shadow-2xl space-y-4 sm:space-y-5">
        <header class="text-center space-y-1">
            <h1 class="text-2xl sm:text-3xl font-bold bg-gradient-to-r from-amber-200 via-amber-400 to-amber-500 bg-clip-text text-transparent">Candle Timer</h1>
            <p class="text-xs text-slate-400">A little light, for up to four hours</p>
        </header>
        <section class="grid grid-cols-2 gap-3 sm:gap-5" aria-label="Set remaining candle time">
            <label class="block min-w-0"><span class="block text-[11px] sm:text-xs font-semibold uppercase tracking-wider text-slate-400 mb-1.5">Time remaining</span>
                <span class="relative block"><input type="number" id="timestampInput" step="0.01" min="0" max="4" placeholder="1.30" aria-label="Hours remaining" class="w-full bg-slate-950 border border-slate-700 rounded-xl px-3 py-3 pr-10 text-lg font-semibold text-slate-100 placeholder-slate-600 focus:outline-none focus:ring-2 focus:ring-amber-500/50 focus:border-amber-500 transition-all"><span class="absolute right-3 top-1/2 -translate-y-1/2 text-sm text-slate-500 pointer-events-none">h</span></span>
                <span id="timestampHint" class="block text-[10px] text-slate-500 mt-1 min-h-[14px]"></span>
            </label>
            <label class="block min-w-0"><span class="block text-[11px] sm:text-xs font-semibold uppercase tracking-wider text-slate-400 mb-1.5">Remaining</span>
                <span class="relative block"><input type="number" id="percentInput" step="0.1" min="0" max="100" placeholder="25" aria-label="Percent remaining" class="w-full bg-slate-950 border border-slate-700 rounded-xl px-3 py-3 pr-10 text-lg font-semibold text-slate-100 placeholder-slate-600 focus:outline-none focus:ring-2 focus:ring-amber-500/50 focus:border-amber-500 transition-all"><span class="absolute right-3 top-1/2 -translate-y-1/2 text-sm text-slate-500 pointer-events-none">%</span></span>
                <span id="percentHint" class="block text-[10px] text-slate-500 mt-1 min-h-[14px]"></span>
            </label>
        </section>
        <section class="relative overflow-hidden bg-slate-950/60 rounded-2xl border border-slate-800/80 shadow-inner px-2 sm:px-5 pt-3 pb-3" aria-label="Candle">
            <div id="flameGlow" class="absolute left-1/2 top-2 w-40 h-40 bg-amber-500/20 rounded-full blur-3xl transition-opacity duration-300 opacity-0 pointer-events-none"></div>
            <div class="relative mx-auto candle-stage"><svg viewBox="0 0 450 330" class="w-full h-full overflow-visible" role="img" aria-label="Candle showing remaining wax">
                <defs>
                    <linearGradient id="candleShade" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#94a3b8" stop-opacity=".24"/><stop offset=".12" stop-color="#fff" stop-opacity=".16"/><stop offset=".5" stop-color="#fff" stop-opacity=".04"/><stop offset=".9" stop-color="#64748b" stop-opacity=".16"/><stop offset="1" stop-color="#0f172a" stop-opacity=".28"/></linearGradient>
                    <linearGradient id="shellGradient" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#64748b"/><stop offset=".18" stop-color="#cbd5e1"/><stop offset=".5" stop-color="#94a3b8"/><stop offset=".82" stop-color="#e2e8f0"/><stop offset="1" stop-color="#64748b"/></linearGradient>
                    <linearGradient id="waxGradient" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f8fafc"/><stop offset="1" stop-color="#e2e8f0"/></linearGradient>
                    <clipPath id="candleClip"><path d="M 48,90 C 48,70 312,70 312,90 L 312,198 C 312,220 48,220 48,198 Z"/></clipPath>
                </defs>
                <path d="M 48,90 C 48,70 312,70 312,90 L 312,198 C 312,220 48,220 48,198 Z" fill="url(#shellGradient)" stroke="#cbd5e1" stroke-width="2.5"/>
                <path d="M 48,90 C 48,70 312,70 312,90 L 312,198 C 312,220 48,220 48,198 Z" fill="url(#candleShade)" pointer-events="none"/>
                <g clip-path="url(#candleClip)"><path id="remainingWax" d="M56,198 L56,122 L304,122 L304,198 Q304,220 180,220 Q56,220 56,198Z" fill="url(#waxGradient)"/><ellipse id="waxLine" cx="180" cy="122" rx="124" ry="16" fill="#f8fafc" stroke="#e2e8f0" stroke-width="2"/></g>
                <ellipse cx="180" cy="90" rx="132" ry="20" fill="none" stroke="#e2e8f0" stroke-width="2.5"/>
                <path id="wick" d="M180,122 L180,149" stroke="#334155" stroke-width="4" stroke-linecap="round"/>
                <g id="flameGroup" class="opacity-0 transition-opacity duration-300"><path class="flame-active" d="M180,119 C158,98 169,68 180,59 C192,70 202,98 180,119Z" fill="#f59e0b"/><path class="flame-active inner-flame-active" d="M180,119 C169,103 174,81 180,75 C187,84 191,103 180,119Z" fill="#fef08a"/><ellipse cx="180" cy="117" rx="5" ry="2.5" fill="#3b82f6" opacity=".85"/></g>
                <path id="smokeTrail" class="smoke" d="M180,60 C170,43 190,33 180,15" stroke="#94a3b8" stroke-width="2" fill="none" stroke-linecap="round"/>
                <path id="levelPointer" d="M 320,122 L 338,113 L 338,131 Z" fill="#fbbf24"/>
                <text id="timeDisplay" x="344" y="118" fill="#f8fafc" font-size="17" font-family="'Plus Jakarta Sans', sans-serif" font-weight="700">01:00:00</text>
                <text id="percentDisplay" x="344" y="141" fill="#94a3b8" font-size="14" font-family="'Plus Jakarta Sans', sans-serif">25.0%</text>
            </svg></div>
            <div class="mt-1 flex items-center justify-center gap-2"><label for="candleColor" class="text-xs text-slate-400">Wax color</label><input id="candleColor" type="color" value="#f8fafc" aria-label="Choose wax color" class="h-8 w-10 cursor-pointer rounded-lg border border-slate-700 bg-slate-900 p-1"></div>
        </section>
        <div class="grid grid-cols-2 gap-3">
            <button id="startPauseBtn" class="w-full py-3 px-4 bg-gradient-to-r from-amber-500 to-amber-600 hover:from-amber-400 hover:to-amber-500 text-slate-950 font-bold rounded-xl shadow-lg shadow-amber-500/20 active:scale-[0.98] transition-all flex items-center justify-center gap-2"><svg id="playIcon" class="w-5 h-5 fill-current" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg><svg id="pauseIcon" class="w-5 h-5 fill-current hidden" viewBox="0 0 24 24"><path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/></svg><span id="startPauseText">Light Candle</span></button>
            <button id="resetBtn" class="w-full py-3 px-4 bg-slate-800 hover:bg-slate-700 text-slate-200 font-semibold rounded-xl border border-slate-700 active:scale-[0.98] transition-all flex items-center justify-center gap-2"><svg class="w-4 h-4 fill-none stroke-current stroke-2" viewBox="0 0 24 24"><path d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"/></svg><span>Extinguish</span></button>
        </div>
    </main>
<script>
        // Constants & State
        const MAX_SECONDS = 4 * 3600; // 4 Hours = 14,400 seconds
        let secondsLeft = 0;
        let timerInterval = null;
        let isRunning = false;

        // UI Elements
        const timestampInput = document.getElementById('timestampInput');
        const percentInput = document.getElementById('percentInput');
        const timestampHint = document.getElementById('timestampHint');
        const percentHint = document.getElementById('percentHint');
        const timeDisplay = document.getElementById('timeDisplay');
        const percentDisplay = document.getElementById('percentDisplay');
        const startPauseBtn = document.getElementById('startPauseBtn');
        const startPauseText = document.getElementById('startPauseText');
        const playIcon = document.getElementById('playIcon');
        const pauseIcon = document.getElementById('pauseIcon');
        const resetBtn = document.getElementById('resetBtn');

        // Visual Flame/Candle Elements
        const flameGroup = document.getElementById('flameGroup');
        const flameGlow = document.getElementById('flameGlow');
        const remainingWax = document.getElementById('remainingWax');
        const waxLine = document.getElementById('waxLine');
        const levelPointer = document.getElementById('levelPointer');
        const candleColor = document.getElementById('candleColor');
        const smokeTrail = document.getElementById('smokeTrail');

        /**
         * Converts decimal timestamp format (e.g., 1.30 for 1h 30m) to total minutes.
         */
        function timestampToMinutes(timestamp) {
            const integerPart = Math.floor(timestamp); // Hours
            const decimalPart = (timestamp - integerPart) / 0.6; // Minutes portion converted back
            return (integerPart * 60) + (decimalPart * 60);
        }

        function updateCandleVisuals() {
            const fraction = Math.max(0, Math.min(1, secondsLeft / MAX_SECONDS));
            const topY = 198 - fraction * 88;
            remainingWax.setAttribute('d', `M 56,198 L 56,${topY} L 304,${topY} L 304,198 Q 304,220 180,220 Q 56,220 56,198 Z`);
            waxLine.setAttribute('cy', topY);
            levelPointer.setAttribute('d', `M 320,${topY} L 338,${topY - 9} L 338,${topY + 9} Z`);
            timeDisplay.setAttribute('y', topY - 4);
            percentDisplay.setAttribute('y', topY + 19);
            const flameOffset = topY - 119;
            flameGroup.setAttribute('transform', `translate(0, ${flameOffset})`);
            flameGlow.style.transform = `translate(-50%, ${flameOffset}px)`;
            document.getElementById('wick').setAttribute('d', `M 180,${topY - 27} L 180,${topY}`);
            if (isRunning && secondsLeft > 0) {
                flameGroup.classList.remove('opacity-0');
                flameGlow.classList.remove('opacity-0');
                smokeTrail.classList.remove('active');
            } else {
                flameGroup.classList.add('opacity-0');
                flameGlow.classList.add('opacity-0');
            }
            updateDigitalDisplay(fraction);
        }

        function updateDigitalDisplay(fraction) {
            const hrs = Math.floor(secondsLeft / 3600);
            const mins = Math.floor((secondsLeft % 3600) / 60);
            const secs = Math.floor(secondsLeft % 60);

            const pad = (num) => String(num).padStart(2, '0');
            timeDisplay.textContent = `${pad(hrs)}:${pad(mins)}:${pad(secs)}`;
            percentDisplay.textContent = `${(fraction * 100).toFixed(1)}%`;
        }

        candleColor.addEventListener('input', (e) => {
            const selectedColor = e.target.value;
            document.querySelectorAll('#waxGradient stop').forEach((stop) => {
                stop.setAttribute('stop-color', selectedColor);
            });
            waxLine.setAttribute('fill', selectedColor);
            // Only the wax changes; the metallic holder remains silver.
        });

        // Handle Decimal Timestamp Input
        timestampInput.addEventListener('input', (e) => {
            const val = parseFloat(e.target.value);
            if (isNaN(val) || val < 0) {
                timestampHint.textContent = '';
                return;
            }

            // Clamp max at 4 hours
            const clampedVal = Math.min(4, val);
            const totalMinutes = timestampToMinutes(clampedVal);
            secondsLeft = Math.round(totalMinutes * 60);
            
            // Limit seconds to 4 hours cap
            if (secondsLeft > MAX_SECONDS) secondsLeft = MAX_SECONDS;

            // Sync Percentage Input
            const percentVal = (secondsLeft / MAX_SECONDS) * 100;
            percentInput.value = percentVal.toFixed(1);

            // Display conversion explanation
            const h = Math.floor(totalMinutes / 60);
            const m = Math.round(totalMinutes % 60);
            timestampHint.textContent = `Converted: ${h}h ${m}m (${secondsLeft}s total)`;
            percentHint.textContent = `Calculated: ${percentVal.toFixed(1)}% of full tealight`;

            if (isRunning) pauseTimer();
            updateCandleVisuals();
        });

        // Handle Percentage Input
        percentInput.addEventListener('input', (e) => {
            const val = parseFloat(e.target.value);
            if (isNaN(val) || val < 0) {
                percentHint.textContent = '';
                return;
            }

            const clampedPercent = Math.min(100, val);
            secondsLeft = Math.round((clampedPercent / 100) * MAX_SECONDS);

            // Back-calculate timestamp decimal format for sync
            const totalHours = secondsLeft / 3600;
            const h = Math.floor(totalHours);
            const m = (totalHours - h) * 60;
            const decimalTimestamp = h + (m * 0.6 / 60);
            
            timestampInput.value = decimalTimestamp.toFixed(2);

            timestampHint.textContent = `Calculated: ${h}h ${Math.round(m)}m`;
            percentHint.textContent = `Set to ${clampedPercent}% capacity`;

            if (isRunning) pauseTimer();
            updateCandleVisuals();
        });

        function startTimer() {
            if (secondsLeft <= 0) return;

            isRunning = true;
            startPauseText.textContent = "Pause Timer";
            playIcon.classList.add('hidden');
            pauseIcon.classList.remove('hidden');

            timerInterval = setInterval(() => {
                if (secondsLeft > 0) {
                    secondsLeft--;
                    updateCandleVisuals();
                    
                    // Keep inputs in sync as timer runs
                    const fraction = secondsLeft / MAX_SECONDS;
                    const percentVal = fraction * 100;
                    percentInput.value = percentVal.toFixed(1);

                    const totalHours = secondsLeft / 3600;
                    const h = Math.floor(totalHours);
                    const m = (totalHours - h) * 60;
                    const decimalTimestamp = h + (m * 0.6 / 60);
                    timestampInput.value = decimalTimestamp.toFixed(2);

                } else {
                    pauseTimer();
                    triggerSmoke();
                }
            }, 1000);

            updateCandleVisuals();
        }

        function pauseTimer() {
            isRunning = false;
            clearInterval(timerInterval);
            startPauseText.textContent = "Light Candle";
            playIcon.classList.remove('hidden');
            pauseIcon.classList.add('hidden');
            updateCandleVisuals();
        }

        function triggerSmoke() {
            smokeTrail.classList.add('active');
            setTimeout(() => {
                smokeTrail.classList.remove('active');
            }, 2000);
        }

        startPauseBtn.addEventListener('click', () => {
            if (isRunning) {
                pauseTimer();
                triggerSmoke();
            } else {
                startTimer();
            }
        });

        resetBtn.addEventListener('click', () => {
            if (isRunning) triggerSmoke();
            pauseTimer();
            secondsLeft = 0;
            timestampInput.value = '';
            percentInput.value = '';
            timestampHint.textContent = '';
            percentHint.textContent = '';
            updateCandleVisuals();
        });

        // Initialize at 1 hour (25%) as default example
        secondsLeft = 3600; // 1 Hour
        percentInput.value = "25";
        timestampInput.value = "1.00";
        timestampHint.textContent = "Default: 1h 0m";
        percentHint.textContent = "Default: 25% capacity";
        updateCandleVisuals();
    </script>
</body>
</html>
