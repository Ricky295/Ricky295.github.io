<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Timer Widget</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;700&family=Playfair+Display:ital,wght@0,700;0,900;1,700&family=Inter:wght@400;500;600;700&display=swap');

  :root {
    --navy: #1A237E;
    --navy-dark: #0D1257;
    --gold: #F5C842;
    --gold-dark: #D4A800;
    --cream: #F8F6F0;
    --white: #FFFFFF;
    --mono: 'JetBrains Mono', monospace;
    --serif: 'Playfair Display', Georgia, serif;
    --ui: 'Inter', system-ui, sans-serif;
  }

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 100%; height: 100%; }

  /* ── WIDGET MODE ── */
  body.widget-mode {
    background: transparent;
    font-family: var(--ui);
    overflow: hidden;
    user-select: none;
    -webkit-user-select: none;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  #widget { display: none; }
  body.widget-mode #widget { display: flex; flex-direction: column; align-items: center; }
  body.widget-mode #designer { display: none; }

  /* Price-tag card */
  .tag-card {
    background: var(--white);
    border: 3px solid var(--navy);
    border-radius: 6px;
    overflow: hidden;
    box-shadow: 0 4px 18px rgba(26,35,126,0.18);
    display: flex;
    flex-direction: column;
    align-items: center;
  }

  .tag-header {
    background: var(--navy);
    width: 100%;
    padding: 6px 16px;
    text-align: center;
  }
  .tag-label {
    font-family: var(--ui);
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    color: var(--white);
  }

  .tag-body {
    padding: 10px 20px 6px;
    display: flex;
    align-items: flex-end;
    gap: 2px;
    position: relative;
  }

  /* The big number — same bold serif as the price */
  .time-main {
    font-family: var(--serif);
    font-weight: 900;
    color: var(--navy);
    line-height: 1;
    letter-spacing: -0.02em;
  }

  /* Superscript-style unit (like the € in the photo) */
  .time-unit {
    font-family: var(--serif);
    font-weight: 700;
    color: var(--navy);
    align-self: flex-start;
    margin-top: 4px;
    line-height: 1;
  }

  /* Gold underline bar — identical to the photo */
  .tag-stripe {
    background: var(--gold);
    height: 10px;
    width: 100%;
  }

  /* Controls row below card */
  .tag-controls {
    display: flex;
    gap: 6px;
    margin-top: 8px;
  }
  .tag-btn {
    font-family: var(--mono);
    font-size: 10px;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    padding: 4px 10px;
    border: 1.5px solid var(--navy);
    border-radius: 4px;
    background: transparent;
    color: var(--navy);
    cursor: pointer;
    font-weight: 600;
    transition: background 0.1s, color 0.1s;
  }
  .tag-btn:hover { background: var(--navy); color: var(--white); }
  .tag-btn.running { background: var(--navy); color: var(--white); }
  .tag-btn.danger { border-color: #b71c1c; color: #b71c1c; }
  .tag-btn.danger:hover { background: #b71c1c; color: var(--white); }

  /* Done state */
  .tag-card.done .time-main { color: var(--gold-dark); }
  .tag-card.done .tag-stripe { background: var(--navy); }
  .tag-card.done .tag-header { background: var(--gold-dark); }

  /* ── DESIGNER MODE ── */
  body.designer-mode {
    background: var(--cream);
    font-family: var(--ui);
    color: var(--navy-dark);
    -webkit-font-smoothing: antialiased;
  }
  body.designer-mode #widget { display: none; }
  #designer {
    max-width: 980px;
    margin: 0 auto;
    padding: 48px 24px 80px;
    display: grid;
    grid-template-columns: 300px 1fr;
    gap: 48px;
    align-items: start;
  }
  @media (max-width: 720px) { #designer { grid-template-columns: 1fr; } }

  .d-header {
    grid-column: 1/-1;
    padding-bottom: 28px;
    border-bottom: 2px solid var(--navy);
    margin-bottom: 4px;
  }
  .d-eyebrow {
    font-family: var(--mono);
    font-size: 11px;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--gold-dark);
    margin-bottom: 10px;
  }
  .d-title {
    font-family: var(--serif);
    font-size: clamp(28px, 4vw, 46px);
    font-weight: 900;
    color: var(--navy);
    letter-spacing: -0.02em;
    line-height: 1.05;
    margin-bottom: 8px;
  }
  .d-sub { font-size: 15px; color: #444; line-height: 1.5; max-width: 520px; }

  .panel {
    background: var(--white);
    border: 1.5px solid #C5C8D6;
    border-radius: 10px;
    padding: 22px;
    position: sticky;
    top: 24px;
  }
  .panel-title {
    font-family: var(--mono);
    font-size: 10px;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: #888;
    margin-bottom: 18px;
    border-bottom: 1px solid #eee;
    padding-bottom: 10px;
  }
  .field { margin-bottom: 16px; }
  .field label { display: block; font-size: 12px; font-weight: 600; color: var(--navy-dark); margin-bottom: 6px; }
  .field input[type="text"], .field input[type="number"], .field select {
    width: 100%;
    padding: 8px 10px;
    border: 1px solid #C5C8D6;
    border-radius: 6px;
    font-family: var(--mono);
    font-size: 13px;
    color: var(--navy-dark);
    background: var(--cream);
  }
  .field .hint { font-size: 11px; color: #888; margin-top: 4px; line-height: 1.4; }
  .range-row { display: flex; gap: 10px; align-items: center; }
  .range-row input { flex: 1; }
  .range-row .val { font-family: var(--mono); font-size: 12px; color: var(--gold-dark); font-weight: 700; min-width: 28px; text-align: right; }

  .preview-area {
    display: flex;
    flex-direction: column;
    gap: 28px;
  }
  .preview-box {
    background: var(--white);
    border: 1.5px solid #C5C8D6;
    border-radius: 10px;
    padding: 32px;
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 160px;
  }
  .code-box {
    background: var(--navy-dark);
    border-radius: 10px;
    padding: 18px;
    position: relative;
  }
  .code-box pre {
    font-family: var(--mono);
    font-size: 12px;
    color: var(--gold);
    white-space: pre-wrap;
    word-break: break-all;
    line-height: 1.6;
  }
  .copy-btn {
    position: absolute;
    top: 12px;
    right: 12px;
    font-family: var(--mono);
    font-size: 10px;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    padding: 4px 10px;
    border: 1px solid var(--gold);
    border-radius: 4px;
    background: transparent;
    color: var(--gold);
    cursor: pointer;
    font-weight: 600;
  }
  .copy-btn.copied { background: var(--gold); color: var(--navy-dark); }

  .d-build-btn {
    width: 100%;
    padding: 10px;
    background: var(--navy);
    color: var(--white);
    border: none;
    border-radius: 6px;
    font-family: var(--mono);
    font-size: 12px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    font-weight: 700;
    cursor: pointer;
    margin-top: 4px;
  }
  .d-build-btn:hover { background: var(--navy-dark); }
</style>
</head>
<body>

<!-- ═══════════════════════ WIDGET ═══════════════════════ -->
<div id="widget">
  <div class="tag-card" id="tag">
    <div class="tag-header"><span class="tag-label" id="wg-label">Timer</span></div>
    <div class="tag-body">
      <span class="time-main" id="wg-display">3:00</span>
      <span class="time-unit" id="wg-unit">m</span>
    </div>
    <div class="tag-stripe"></div>
  </div>
  <div class="tag-controls" id="wg-controls">
    <button class="tag-btn" id="wg-startstop">Start</button>
    <button class="tag-btn danger" id="wg-reset">Reset</button>
  </div>
</div>

<!-- ═══════════════════════ DESIGNER ═══════════════════════ -->
<div id="designer">
  <div class="d-header">
    <div class="d-eyebrow">— Timer Widget</div>
    <div class="d-title">Price-Tag<br><em style="font-style:italic;color:var(--gold-dark)">Countdown</em></div>
    <p class="d-sub">Configure your timer below. Embed it anywhere with an <code style="font-family:var(--mono);font-size:13px">&lt;iframe&gt;</code>.</p>
  </div>

  <div class="panel">
    <div class="panel-title">Configure</div>
    <div class="field">
      <label>Duration</label>
      <input type="number" id="d-duration" value="3" min="0" step="0.01" style="font-size:18px;padding:10px 12px;">
      <div class="hint">Type <strong>3.25</strong> for 3 min 25 sec — decimal part is seconds, not tenths.</div>
    </div>
    <div class="field">
      <label>Unit</label>
      <select id="d-unit">
        <option value="m">m — minutes (mm:ss)</option>
        <option value="h">h — hours (hh:mm)</option>
      </select>
      <div class="hint">Shown superscript, like € in the price tag.</div>
    </div>
    <div class="field">
      <label>Label</label>
      <input type="text" id="d-label" value="Timer" maxlength="20">
      <div class="hint">Shown in the navy header strip.</div>
    </div>
    <div class="field">
      <label>Font size (px)</label>
      <div class="range-row">
        <input type="range" id="d-size" min="48" max="140" value="80">
        <span class="val" id="d-size-val">80</span>
      </div>
    </div>
    <div class="field">
      <label>Show controls</label>
      <select id="d-controls">
        <option value="1">Yes</option>
        <option value="0">No</option>
      </select>
    </div>
    <button class="d-build-btn" id="d-build">Generate Embed ↓</button>
  </div>

  <div class="preview-area">
    <div class="preview-box" id="d-preview-box">
      <iframe id="d-iframe" frameborder="0" scrolling="no"></iframe>
    </div>
    <div class="code-box">
      <button class="copy-btn" id="d-copy">Copy</button>
      <pre id="d-code"></pre>
    </div>
  </div>
</div>

<script>
(() => {
  const params = new URLSearchParams(location.search);

  // ── decide mode ──
  if (params.has('t')) {
    runWidget();
  } else {
    document.body.classList.add('designer-mode');
    runDesigner();
  }

  // ════════════════════════════════════════
  // WIDGET
  // ════════════════════════════════════════
  function runWidget() {
    document.body.classList.add('widget-mode');

    const unit     = params.get('unit') || 'm';
    const totalSec = parseDuration(params.get('t') || '3', unit);
    const label    = params.get('label') || 'Timer';
    const fontSize = parseInt(params.get('fs') || '80');
    const showCtrl = params.get('ctrl') !== '0';

    const tag      = document.getElementById('tag');
    const display  = document.getElementById('wg-display');
    const unitEl   = document.getElementById('wg-unit');
    const labelEl  = document.getElementById('wg-label');
    const ctrlRow  = document.getElementById('wg-controls');
    const startBtn = document.getElementById('wg-startstop');
    const resetBtn = document.getElementById('wg-reset');

    display.style.fontSize = fontSize + 'px';
    unitEl.style.fontSize  = Math.round(fontSize * 0.28) + 'px';
    labelEl.textContent    = label;
    unitEl.textContent     = unit;
    if (!showCtrl) ctrlRow.style.display = 'none';

    let remaining = totalSec;
    let running   = false;
    let iv        = null;

    function fmt(sec) {
      if (unit === 'h') {
        const h = Math.floor(sec / 3600);
        const m = Math.floor((sec % 3600) / 60);
        return pad(h) + ':' + pad(m);
      } else {
        const m = Math.floor(sec / 60);
        const s = sec % 60;
        return pad(m) + ':' + pad(s);
      }
    }
    function pad(n) { return String(n).padStart(2, '0'); }

    function tick() {
      if (remaining <= 0) {
        clearInterval(iv);
        running = false;
        startBtn.textContent = 'Done';
        startBtn.classList.remove('running');
        tag.classList.add('done');
        display.textContent = fmt(0);
        window.parent.postMessage({ type: 'timer-done' }, '*');
        return;
      }
      remaining--;
      display.textContent = fmt(remaining);
    }

    display.textContent = fmt(remaining);

    startBtn.addEventListener('click', () => {
      if (tag.classList.contains('done')) return;
      running = !running;
      if (running) {
        iv = setInterval(tick, 1000);
        startBtn.textContent = 'Pause';
        startBtn.classList.add('running');
      } else {
        clearInterval(iv);
        startBtn.textContent = 'Resume';
        startBtn.classList.remove('running');
      }
    });

    resetBtn.addEventListener('click', () => {
      clearInterval(iv);
      running = false;
      remaining = totalSec;
      tag.classList.remove('done');
      startBtn.textContent = 'Start';
      startBtn.classList.remove('running');
      display.textContent = fmt(remaining);
    });
  }

  function parseDuration(val, unit) {
    const n    = parseFloat(val) || 3;
    const whole = Math.floor(n);
    const frac  = n - whole;
    // frac is in "intuitive" units: .25 → 25 sec (or 25 min for hours)
    // convert: frac / 0.6 gives the real fractional part of the major unit
    const realFrac = frac / 0.6;
    if (unit === 'h') {
      return Math.round((whole + realFrac) * 3600);
    } else {
      return Math.round((whole + realFrac) * 60);
    }
  }

  // ════════════════════════════════════════
  // DESIGNER
  // ════════════════════════════════════════
  function runDesigner() {
    const durInput  = document.getElementById('d-duration');
    const unitSel   = document.getElementById('d-unit');
    const labelInp  = document.getElementById('d-label');
    const sizeRange = document.getElementById('d-size');
    const sizeVal   = document.getElementById('d-size-val');
    const ctrlSel   = document.getElementById('d-controls');
    const buildBtn  = document.getElementById('d-build');
    const iframe    = document.getElementById('d-iframe');
    const codeEl    = document.getElementById('d-code');
    const copyBtn   = document.getElementById('d-copy');

    unitSel.addEventListener('change', update);
    durInput.addEventListener('input', update);
    sizeRange.addEventListener('input', () => { sizeVal.textContent = sizeRange.value; update(); });
    [labelInp, ctrlSel].forEach(el => el.addEventListener('input', update));
    buildBtn.addEventListener('click', update);

    function buildURL() {
      const p = new URLSearchParams();
      p.set('t',     durInput.value || '3');
      p.set('unit',  unitSel.value);
      p.set('label', labelInp.value || 'Timer');
      p.set('fs',    sizeRange.value);
      if (ctrlSel.value === '0') p.set('ctrl', '0');
      return location.href.split('?')[0] + '?' + p.toString();
    }

    function update() {
      const url = buildURL();
      const fs  = parseInt(sizeRange.value);
      const w   = fs * 4;
      const h   = fs * 2 + 80;
      iframe.src    = url;
      iframe.width  = w;
      iframe.height = h;
      codeEl.textContent =
`<iframe src="${url}"
  width="${w}" height="${h}"
  frameborder="0" title="Timer"></iframe>`;
    }

    copyBtn.addEventListener('click', () => {
      navigator.clipboard.writeText(codeEl.textContent).then(() => {
        copyBtn.textContent = 'Copied!';
        copyBtn.classList.add('copied');
        setTimeout(() => { copyBtn.textContent = 'Copy'; copyBtn.classList.remove('copied'); }, 1400);
      });
    });

    update();
  }
})();
</script>
</body>
</html>
