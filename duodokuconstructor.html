<!DOCTYPE html>
<html lang="en">
<head>
  <script type="module" src="duodokutecniques-bridge.js"></script>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sufufu Constructor</title>
  <link rel="stylesheet" href="googletitle.css">
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      max-width: 1200px;
      margin: 0 auto;
      padding: 20px 15px;
      color: #e8eaed;
      background: linear-gradient(135deg, #0f0c29 0%, #302b63 50%, #24243e 100%);
      min-height: 100vh;
      transition: background 0.3s ease, color 0.3s ease;
    }

    body.light-mode {
      color: #2d3436;
      background: linear-gradient(135deg, #a8edea 0%, #fed6e3 100%);
    }

    /* Theme toggle button */
    .theme-toggle {
      position: fixed;
      top: 20px;
      right: 20px;
      background: rgba(255, 255, 255, 0.1);
      backdrop-filter: blur(10px);
      border: 1px solid rgba(255, 255, 255, 0.2);
      color: white;
      border-radius: 50%;
      width: 50px;
      height: 50px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      font-size: 24px;
      transition: all 0.3s ease;
      z-index: 1000;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
    }

    .theme-toggle:hover {
      transform: scale(1.1) rotate(20deg);
      box-shadow: 0 6px 20px rgba(0, 0, 0, 0.3);
    }

    body.light-mode .theme-toggle {
      background: rgba(0, 0, 0, 0.1);
      border: 1px solid rgba(0, 0, 0, 0.2);
      color: #2d3436;
    }

    table {
      border-collapse: collapse;
      margin: 20px 0;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
      border-radius: 8px;
      overflow: hidden;
      background: rgba(255, 255, 255, 0.05);
      backdrop-filter: blur(10px);
      transition: background 0.3s ease, box-shadow 0.3s ease;
    }

    body.light-mode table {
      background: rgba(255, 255, 255, 0.6);
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.15);
    }

    td {
      width: 55px;
      height: 55px;
      text-align: center;
      border: 1px solid rgba(255, 255, 255, 0.2);
      font-size: 24px;
      transition: all 0.2s ease;
    }

    body.light-mode td {
      border: 1px solid rgba(0, 0, 0, 0.1);
    }

    .cell-div {
      display: flex;
      justify-content: center;
      align-items: center;
      background: linear-gradient(135deg, rgba(30, 30, 50, 0.6) 0%, rgba(20, 20, 40, 0.8) 100%);
      cursor: pointer;
      position: relative;
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      font-weight: 700;
      color: #ffffff;
      width: 100%;
      height: 100%;
    }

    body.light-mode .cell-div {
      background: linear-gradient(135deg, rgba(255, 255, 255, 0.8) 0%, rgba(240, 240, 255, 0.9) 100%);
      color: #2d3436;
    }

    .cell-div:hover {
      background: linear-gradient(135deg, rgba(40, 40, 60, 0.8) 0%, rgba(30, 30, 50, 0.9) 100%);
      transform: scale(1.05);
    }

    body.light-mode .cell-div:hover {
      background: linear-gradient(135deg, rgba(255, 255, 255, 0.95) 0%, rgba(230, 230, 250, 1) 100%);
    }

    .selected-cell {
      outline: 3px solid #64b5f6;
      outline-offset: -3px;
      box-shadow: 0 0 20px rgba(100, 181, 246, 0.6), inset 0 0 20px rgba(100, 181, 246, 0.2);
      z-index: 10;
    }

    .redundant {
      border-radius: 50%;
      border: 3px solid #64b5f6 !important;
    }

    body.light-mode .redundant {
      border: 3px solid #1976d2 !important;
    }

    .candidates {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      grid-template-rows: repeat(2, 1fr);
      width: 100%;
      height: 100%;
      font-size: 40%;
    }

    .candidate {
      display: flex;
      justify-content: center;
      align-items: center;
      color: rgba(255, 255, 255, 0.5);
      transition: all 0.2s ease;
    }

    body.light-mode .candidate {
      color: rgba(0, 0, 0, 0.5);
    }

    td:nth-child(4n) {
      border-right: 3px solid rgba(100, 181, 246, 0.5);
    }

    td:nth-child(1) {
      border-left: 3px solid rgba(100, 181, 246, 0.5);
    }

    tr:nth-child(2n) td {
      border-bottom: 3px solid rgba(100, 181, 246, 0.5);
    }

    tr:nth-child(1) td {
      border-top: 3px solid rgba(100, 181, 246, 0.5);
    }

    body.light-mode td:nth-child(4n) {
      border-right: 3px solid rgba(25, 118, 210, 0.4);
    }

    body.light-mode td:nth-child(1) {
      border-left: 3px solid rgba(25, 118, 210, 0.4);
    }

    body.light-mode tr:nth-child(2n) td {
      border-bottom: 3px solid rgba(25, 118, 210, 0.4);
    }

    body.light-mode tr:nth-child(1) td {
      border-top: 3px solid rgba(25, 118, 210, 0.4);
    }

    #rules {
      text-align: center;
    }

    .info-box {
      text-align: center;
      margin: 15px 0;
      padding: 12px;
      background: rgba(255, 255, 255, 0.1);
      backdrop-filter: blur(10px);
      border-radius: 8px;
      font-size: 14px;
      transition: background 0.3s ease;
    }

    body.light-mode .info-box {
      background: rgba(255, 255, 255, 0.7);
    }

    .puzzle-container {
      display: flex;
      flex-direction: row;
      align-items: flex-start;
      gap: 30px;
      justify-content: center;
      margin-top: 20px;
    }

    .puzzle-column {
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .controls-column {
      display: flex;
      flex-direction: column;
      gap: 15px;
      min-width: 220px;
    }

    .numpad-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      margin: 0;
      width: 220px;
      background: rgba(255, 255, 255, 0.05);
      backdrop-filter: blur(10px);
      padding: 20px;
      border-radius: 12px;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
      transition: background 0.3s ease, box-shadow 0.3s ease;
    }

    body.light-mode .numpad-container {
      background: rgba(255, 255, 255, 0.6);
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.15);
    }

    .numpad {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 12px;
      width: 100%;
    }

    .numpad-button {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      border: none;
      color: white;
      border-radius: 8px;
      padding: 20px 0;
      font-size: 24px;
      font-weight: 700;
      text-align: center;
      cursor: pointer;
      user-select: none;
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      box-shadow: 0 4px 15px rgba(102, 126, 234, 0.4);
    }

    .numpad-button:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(102, 126, 234, 0.6);
    }

    .numpad-button:active {
      transform: translateY(0) scale(0.95);
      box-shadow: 0 2px 10px rgba(102, 126, 234, 0.4);
    }

    .btn-group {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    button, .btn {
      display: block;
      width: 100%;
      margin: 0;
      padding: 12px 16px;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      border: none;
      border-radius: 8px;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      transition: all 0.3s ease;
      box-shadow: 0 4px 15px rgba(102, 126, 234, 0.3);
      position: relative;
      overflow: hidden;
      text-align: center;
      user-select: none;
    }

    button::before, .btn::before {
      content: '';
      position: absolute;
      top: 0;
      left: -100%;
      width: 100%;
      height: 100%;
      background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.3), transparent);
      transition: left 0.5s ease;
    }

    button:hover::before, .btn:hover::before {
      left: 100%;
    }

    button:hover, .btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(102, 126, 234, 0.5);
    }

    button:active, .btn:active {
      transform: translateY(0);
    }

    .btn-clear {
      background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
      box-shadow: 0 4px 15px rgba(245, 87, 108, 0.3);
    }

    .btn-clear:hover {
      box-shadow: 0 6px 20px rgba(245, 87, 108, 0.5);
    }

    .btn-analyze {
      background: linear-gradient(135deg, #11998e 0%, #38ef7d 100%);
      box-shadow: 0 4px 15px rgba(17, 153, 142, 0.3);
    }

    .btn-analyze:hover {
      box-shadow: 0 6px 20px rgba(17, 153, 142, 0.5);
    }

    .btn-export {
      background: linear-gradient(135deg, #4facfe 0%, #00f2fe 100%);
      box-shadow: 0 4px 15px rgba(79, 172, 254, 0.3);
    }

    .btn-export:hover {
      box-shadow: 0 6px 20px rgba(79, 172, 254, 0.5);
    }

    #status {
      text-align: center;
      font-size: 15px;
      font-weight: bold;
      margin: 0;
      padding: 12px;
      border-radius: 8px;
      background: rgba(255, 255, 255, 0.1);
      backdrop-filter: blur(10px);
      min-height: 24px;
      transition: background 0.3s ease;
    }

    body.light-mode #status {
      background: rgba(255, 255, 255, 0.7);
    }

    .status.unique { color: #38ef7d; }
    .status.multiple { color: #ffd200; }
    .status.none { color: #ff6a6a; }

    body.light-mode .status.unique { color: #157347; }
    body.light-mode .status.multiple { color: #a6720a; }
    body.light-mode .status.none { color: #b02a2a; }

    /* Difficulty Display */
    .difficulty-display {
      background: rgba(255, 255, 255, 0.05);
      backdrop-filter: blur(10px);
      border-radius: 12px;
      padding: 15px;
      margin: 10px 0;
      text-align: center;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
      transition: background 0.3s ease;
    }

    body.light-mode .difficulty-display {
      background: rgba(255, 255, 255, 0.6);
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.15);
    }

    .difficulty-indicator {
      text-align: center;
      font-size: 16px;
      font-weight: bold;
      margin: 0 0 10px 0;
      padding: 8px 18px;
      border-radius: 8px;
      display: inline-block;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3);
    }

    .difficulty-1 {
      background: linear-gradient(135deg, #11998e 0%, #38ef7d 100%);
      color: white;
    }

    .difficulty-2 {
      background: linear-gradient(135deg, #f7971e 0%, #ffd200 100%);
      color: #2d3436;
    }

    .difficulty-3 {
      background: linear-gradient(135deg, #ee0979 0%, #ff6a00 100%);
      color: white;
    }

    .difficulty-4 {
      background: linear-gradient(135deg, #c31432 0%, #240b36 100%);
      color: white;
    }

    .difficulty-unknown {
      background: linear-gradient(135deg, #636e72 0%, #2d3436 100%);
      color: white;
    }

    .technique-bar-container {
      margin-top: 10px;
    }

    .technique-bar {
      height: 20px;
      border-radius: 10px;
      overflow: hidden;
      display: flex;
      border: 1px solid rgba(255, 255, 255, 0.2);
      background: rgba(0, 0, 0, 0.3);
    }

    .technique-segment {
      height: 100%;
      position: relative;
      transition: all 0.3s ease;
    }

    .technique-segment:hover {
      filter: brightness(1.2);
      cursor: pointer;
    }

    .tech-lastdigit { background-color: #0066cc; }
    .tech-lasttwin { background-color: #4da6ff; }
    .tech-orthogonalnakedsingle { background-color: #17a2b8; }
    .tech-nakedsingle { background-color: #ffc107; }
    .tech-boxhs { background-color: #28a745; }
    .tech-boxht { background-color: #fd7e14; }
    .tech-linehs { background-color: #38ef7d; }
    .tech-lineht { background-color: #e67e22; }
    .tech-almostcorner { background-color: #dc3545; }
    .tech-almostseparated { background-color: #c0392b; }
    .tech-intersectionbasic { background-color: #9b59b6; }
    .tech-intersectionadvanced { background-color: #8e44ad; }
    .tech-diamond { background-color: #16a085; }
    .tech-unitednakedpair { background-color: #d35400; }
    .tech-combobasic { background-color: #800000; }
    .tech-comboadvanced { background-color: #4a0000; }
    .tech-unknown { background-color: #000000; }

    .technique-legend {
      margin-top: 8px;
      font-size: 12px;
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
      gap: 5px;
      text-align: left;
    }

    .legend-item {
      display: flex;
      align-items: center;
      gap: 5px;
    }

    .legend-color {
      width: 12px;
      height: 12px;
      border-radius: 2px;
      display: inline-block;
      flex-shrink: 0;
    }

    @media (max-width: 768px) {
      body {
        padding: 15px 10px;
      }

      .puzzle-container {
        flex-direction: column;
        align-items: center;
        gap: 20px;
      }

      .controls-column {
        width: 100%;
        max-width: 320px;
      }

      td {
        width: 42px;
        height: 42px;
        font-size: 20px;
      }
    }
  </style>
</head>
<body>
<button class="theme-toggle" id="themeToggle" title="Toggle light/dark mode">🌙</button>
<h1 class="gradient-title">Sufufu Constructor</h1>

<div class="info-box">
  <strong>Rules:</strong> Use digits 1–4 exactly twice per row, column, and 2×4 box. No same digits may touch orthogonally.
</div>

<div class="puzzle-container">
  <!-- Left column with puzzle -->
  <div class="puzzle-column">
    <table id="puzzleTable"></table>

    <div class="info-box">
      <div>Givens: <span id="givens">0</span>/64</div>
      <div>Solutions: <span id="solutions">Unknown</span></div>
    </div>

    <div class="difficulty-display">
      <div class="difficulty-indicator difficulty-unknown" id="difficultyBadge">
        Difficulty: Unknown
      </div>
      <div class="technique-bar-container">
        <div class="technique-bar" id="techniqueBar"></div>
        <div class="technique-legend" id="techniqueLegend"></div>
      </div>
    </div>
  </div>

  <!-- Right column with controls -->
  <div class="controls-column">
    <div class="numpad-container">
      <div class="numpad">
        <div class="numpad-button" data-value="1">1</div>
        <div class="numpad-button" data-value="2">2</div>
        <div class="numpad-button" data-value="3">3</div>
        <div class="numpad-button" data-value="4">4</div>
      </div>
    </div>

    <div class="btn-group">
      <button class="btn-clear" id="clear">Clear Cell</button>
      <button class="btn-analyze" id="analyze">Analyze</button>
      <button id="showCandidates">Show Candidates</button>
      <button id="pastePuzzle">Paste Puzzle String</button>
      <button id="findRedundant">Find Redundant</button>
      <button class="btn-export" id="exportPlay">Export to Play</button>
      <button class="btn-export" id="copyString">Copy String</button>
      <button id="clearAll">Clear All</button>
    </div>

    <div id="status" class="status"></div>
  </div>
</div>

<script>
  // ---------------------------------------------------------------
  // Wait for duodokutecniques.js (loaded via the bridge module) to be
  // ready, then run the app.
  // ---------------------------------------------------------------
  function startApp() {
    const T = window.DuoDokuTechniques;

    // App state
    let grid = Array(8).fill().map(() => Array(8).fill(0));
    let selectedCell = null;
    let showingCandidates = false;
    let redundantCells = new Set();
    let lastAnalysisNotations = null; // notations board from last analysis (for candidate display)
    let techniqueCounts = {}; // technique key -> count, from last analysis

    // Human-friendly labels + CSS classes for each technique key
    const TECH_META = {
      last_digit: { label: 'Last Digit', cls: 'tech-lastdigit' },
      last_twin: { label: 'Last Twin', cls: 'tech-lasttwin' },
      orthogonal_naked_single: { label: 'Orthogonal Naked Single', cls: 'tech-orthogonalnakedsingle' },
      naked_single: { label: 'Naked Single', cls: 'tech-nakedsingle' },
      box_hs: { label: 'Hidden Single (Box)', cls: 'tech-boxhs' },
      box_ht: { label: 'Hidden Twin (Box)', cls: 'tech-boxht' },
      line_hs: { label: 'Hidden Single (Line)', cls: 'tech-linehs' },
      line_ht: { label: 'Hidden Twin (Line)', cls: 'tech-lineht' },
      almost_ht_corner: { label: 'Almost Hidden Twin (Corner)', cls: 'tech-almostcorner' },
      almost_ht_separated: { label: 'Almost Hidden Twin (Separated)', cls: 'tech-almostseparated' },
      intersection_basic: { label: 'Intersection (Basic)', cls: 'tech-intersectionbasic' },
      intersection_advanced: { label: 'Intersection (Advanced)', cls: 'tech-intersectionadvanced' },
      diamond: { label: 'Diamond', cls: 'tech-diamond' },
      united_naked_pair: { label: 'United Naked Pair', cls: 'tech-unitednakedpair' },
      combinations_basic: { label: 'Combinations (Basic)', cls: 'tech-combobasic' },
      combinations_advanced: { label: 'Combinations (Advanced)', cls: 'tech-comboadvanced' },
    };

    // Rough difficulty tiers based on which techniques were needed
    const EASY_TECHS = new Set(['last_digit', 'last_twin', 'orthogonal_naked_single', 'naked_single', 'box_hs', 'line_hs']);
    const MEDIUM_TECHS = new Set(['box_ht', 'line_ht', 'united_naked_pair']);
    const HARD_TECHS = new Set(['almost_ht_corner', 'almost_ht_separated', 'intersection_basic', 'intersection_advanced', 'diamond']);

    function gridToString(g) {
      return g.flat().map(v => v || 0).join('');
    }

    function init() {
      renderTable();
      setupEventListeners();
      updateStatus();
      analyzeDifficultyAndTechniques();
    }

    function renderTable() {
      const table = document.getElementById('puzzleTable');
      let html = '';
      for (let row = 0; row < 8; row++) {
        html += '<tr>';
        for (let col = 0; col < 8; col++) {
          const value = grid[row][col];
          const isRedundant = redundantCells.has(`${row}-${col}`);
          html += `
            <td>
              <div class="cell-div${isRedundant ? ' redundant' : ''}"
                   data-row="${row}" data-col="${col}">
                ${value || ''}
                <div class="candidates" style="display: none">
                  <div class="candidate" data-value="1"></div>
                  <div class="candidate" data-value="2"></div>
                  <div class="candidate" data-value="3"></div>
                  <div class="candidate" data-value="4"></div>
                </div>
              </div>
            </td>`;
        }
        html += '</tr>';
      }
      table.innerHTML = html;
      setupCellListeners();
    }

    function setupCellListeners() {
      document.querySelectorAll('.cell-div').forEach(cell => {
        cell.addEventListener('click', function () {
          if (selectedCell) {
            selectedCell.classList.remove('selected-cell');
          }
          selectedCell = this;
          selectedCell.classList.add('selected-cell');
        });
      });
    }

    function setValue(row, col, value) {
      grid[row][col] = grid[row][col] === value ? 0 : value;
      renderTable();
      updateStatus();
      analyzeDifficultyAndTechniques();
    }

    function setupEventListeners() {
      // Numpad
      document.querySelectorAll('.numpad-button').forEach(btn => {
        btn.addEventListener('click', function () {
          if (selectedCell) {
            const value = parseInt(this.dataset.value);
            const row = parseInt(selectedCell.dataset.row);
            const col = parseInt(selectedCell.dataset.col);
            setValue(row, col, value);
          }
        });
      });

      // Clear current cell
      document.getElementById('clear').addEventListener('click', function () {
        if (selectedCell) {
          const row = parseInt(selectedCell.dataset.row);
          const col = parseInt(selectedCell.dataset.col);
          grid[row][col] = 0;
          renderTable();
          updateStatus();
          analyzeDifficultyAndTechniques();
        }
      });

      document.getElementById('analyze').addEventListener('click', analyze);
      document.getElementById('showCandidates').addEventListener('click', toggleCandidates);
      document.getElementById('pastePuzzle').addEventListener('click', pasteString);
      document.getElementById('findRedundant').addEventListener('click', findRedundant);
      document.getElementById('exportPlay').addEventListener('click', exportToPlay);
      document.getElementById('copyString').addEventListener('click', copyString);

      document.getElementById('clearAll').addEventListener('click', function () {
        grid = Array(8).fill().map(() => Array(8).fill(0));
        redundantCells.clear();
        lastAnalysisNotations = null;
        techniqueCounts = {};
        renderTable();
        updateStatus();
        document.getElementById('solutions').textContent = 'Unknown';
        analyzeDifficultyAndTechniques();
      });

      // Keyboard
      document.addEventListener('keydown', function (e) {
        if (!selectedCell) return;
        const row = parseInt(selectedCell.dataset.row);
        const col = parseInt(selectedCell.dataset.col);
        if (['1', '2', '3', '4'].includes(e.key)) {
          setValue(row, col, parseInt(e.key));
        } else if (e.key === 'Delete' || e.key === 'Backspace') {
          grid[row][col] = 0;
          renderTable();
          updateStatus();
          analyzeDifficultyAndTechniques();
        }
      });
    }

    function updateStatus() {
      const givens = grid.flat().filter(x => x !== 0).length;
      document.getElementById('givens').textContent = givens;
    }

    function countSolutions(maxSolutions = 1000) {
      // Simple backtracking counter using the same constraints as the solver.
      const g = grid.map(row => [...row]);
      let count = 0;

      function isValid(row, col, num) {
        let rowCount = 0;
        for (let c = 0; c < 8; c++) if (g[row][c] === num) rowCount++;
        if (rowCount >= 2) return false;
        let colCount = 0;
        for (let r = 0; r < 8; r++) if (g[r][col] === num) colCount++;
        if (colCount >= 2) return false;
        const boxRow = Math.floor(row / 2) * 2;
        const boxCol = Math.floor(col / 4) * 4;
        let boxCount = 0;
        for (let r = 0; r < 2; r++)
          for (let c = 0; c < 4; c++)
            if (g[boxRow + r][boxCol + c] === num) boxCount++;
        if (boxCount >= 2) return false;
        const directions = [[-1, 0], [1, 0], [0, -1], [0, 1]];
        for (const [dr, dc] of directions) {
          const nr = row + dr, nc = col + dc;
          if (nr >= 0 && nr < 8 && nc >= 0 && nc < 8 && g[nr][nc] === num) return false;
        }
        return true;
      }

      function backtrack(pos) {
        if (count >= maxSolutions) return;
        if (pos === 64) { count++; return; }
        const r = Math.floor(pos / 8), c = pos % 8;
        if (g[r][c] !== 0) { backtrack(pos + 1); return; }
        for (let num = 1; num <= 4; num++) {
          if (isValid(r, c, num)) {
            g[r][c] = num;
            backtrack(pos + 1);
            g[r][c] = 0;
            if (count >= maxSolutions) return;
          }
        }
      }

      backtrack(0);
      return count;
    }

    function analyze() {
      const maxSolutions = 1000;
      const count = countSolutions(maxSolutions);
      const countLabel = count >= maxSolutions ? `${maxSolutions}+` : count;
      document.getElementById('solutions').textContent = countLabel;
      const status = document.getElementById('status');
      if (count === 0) {
        status.textContent = 'No valid solutions';
        status.className = 'status none';
      } else if (count === 1) {
        status.textContent = 'Unique solution!';
        status.className = 'status unique';
      } else {
        status.textContent = `Multiple solutions (${countLabel})`;
        status.className = 'status multiple';
      }

      analyzeDifficultyAndTechniques();
    }

    function analyzeDifficultyAndTechniques() {
      try {
        const puzzleString = gridToString(grid);
        const result = T.solve(puzzleString);

        lastAnalysisNotations = result.notations;
        techniqueCounts = result.counts;

        // Figure out difficulty tier from which techniques were actually used
        let difficulty = 1;
        let anyUsed = false;
        for (const key of Object.keys(techniqueCounts)) {
          if (techniqueCounts[key] > 0) {
            anyUsed = true;
            if (HARD_TECHS.has(key) || key === 'combinations_basic' || key === 'combinations_advanced') {
              difficulty = Math.max(difficulty, 3);
            } else if (MEDIUM_TECHS.has(key)) {
              difficulty = Math.max(difficulty, 2);
            }
          }
        }

        if (!result.solved) {
          difficulty = 4; // couldn't be fully solved by known techniques -> unfair
        } else if (!anyUsed && puzzleString.replace(/0/g, '').length < 64) {
          difficulty = 1;
        }

        updateDifficultyDisplay(difficulty, result.solved);
        updateTechniqueBar();
      } catch (error) {
        console.error('Error analyzing difficulty and techniques:', error);
        const badge = document.getElementById('difficultyBadge');
        badge.textContent = 'Difficulty: Error';
        badge.className = 'difficulty-indicator difficulty-unknown';
      }
    }

    function updateDifficultyDisplay(difficulty, solved) {
      const difficultyNames = { 1: 'EASY', 2: 'MEDIUM', 3: 'HARD', 4: 'UNFAIR' };
      const badge = document.getElementById('difficultyBadge');
      const label = solved ? (difficultyNames[difficulty] || 'Unknown') : 'UNSOLVED BY TECHNIQUES';
      badge.textContent = `Difficulty: ${label}`;
      badge.className = `difficulty-indicator difficulty-${solved ? difficulty : 'unknown'}`;
    }

    function updateTechniqueBar() {
      const bar = document.getElementById('techniqueBar');
      const legend = document.getElementById('techniqueLegend');

      const techniques = Object.keys(techniqueCounts)
        .filter(key => techniqueCounts[key] > 0)
        .map(key => ({
          key,
          count: techniqueCounts[key],
          label: (TECH_META[key] && TECH_META[key].label) || key,
          cls: (TECH_META[key] && TECH_META[key].cls) || 'tech-unknown',
        }));

      const lengths = techniques.map(tech => ({
        ...tech,
        length: Math.sqrt(tech.count),
      }));

      const totalLength = lengths.reduce((sum, t) => sum + t.length, 0);

      let barHTML = '';
      let legendHTML = '';

      if (totalLength > 0) {
        lengths.forEach(tech => {
          const percentage = (tech.length / totalLength) * 100;
          barHTML += `<div class="technique-segment ${tech.cls}"
                         style="width: ${percentage}%"
                         title="${tech.label}: ${tech.count} uses"></div>`;
        });

        lengths.forEach(tech => {
          legendHTML += `
            <div class="legend-item">
              <div class="legend-color ${tech.cls}"></div>
              <span>${tech.label} (${tech.count})</span>
            </div>
          `;
        });
      } else {
        barHTML = '<div class="technique-segment tech-unknown" style="width: 100%" title="No analysis available"></div>';
        legendHTML = '<div class="legend-item"><div class="legend-color tech-unknown"></div><span>No techniques used</span></div>';
      }

      bar.innerHTML = barHTML;
      legend.innerHTML = legendHTML;
    }

    function toggleCandidates() {
      showingCandidates = !showingCandidates;
      const btn = document.getElementById('showCandidates');
      if (showingCandidates) {
        // Re-run the technique chain fresh so candidates reflect the current grid
        const puzzleString = gridToString(grid);
        const result = T.solve(puzzleString);
        lastAnalysisNotations = result.notations;

        document.querySelectorAll('.cell-div').forEach(cell => {
          const row = parseInt(cell.dataset.row);
          const col = parseInt(cell.dataset.col);
          if (grid[row][col] === 0) {
            const candidatesDiv = cell.querySelector('.candidates');
            candidatesDiv.style.display = 'grid';

            const cellNotation = lastAnalysisNotations[row][col];
            const possible = Array.isArray(cellNotation) ? cellNotation : [cellNotation];

            candidatesDiv.querySelectorAll('.candidate').forEach(candEl => {
              const value = parseInt(candEl.dataset.value);
              candEl.textContent = possible.includes(value) ? value : '';
            });
          }
        });
        btn.textContent = 'Hide Candidates';
      } else {
        document.querySelectorAll('.candidates').forEach(c => {
          c.style.display = 'none';
        });
        btn.textContent = 'Show Candidates';
      }
    }

    function pasteString() {
      try {
        const string = prompt('Insert the 64-character puzzle string here:');
        if (string === null) return; // User cancelled

        if (string.length !== 64) {
          throw new Error('Puzzle string must be exactly 64 characters long.');
        }

        for (let i = 0; i < string.length; i++) {
          const char = string[i];
          if (char !== '0' && char !== '.' && (char < '1' || char > '4')) {
            throw new Error(`Invalid character '${char}' at position ${i + 1}. Only digits 0, 1, 2, 3, 4, or '.' are allowed.`);
          }
        }

        redundantCells.clear();
        lastAnalysisNotations = null;
        techniqueCounts = {};

        for (let i = 0; i < 64; i++) {
          const row = Math.floor(i / 8);
          const col = i % 8;
          const char = string[i];
          grid[row][col] = (char === '.' || char === '0') ? 0 : parseInt(char, 10);
        }

        renderTable();
        updateStatus();
        document.getElementById('solutions').textContent = 'Unknown';
        analyzeDifficultyAndTechniques();

        document.getElementById('status').textContent = 'Puzzle string pasted successfully!';
        document.getElementById('status').className = 'status unique';
      } catch (error) {
        alert('Error pasting puzzle string: ' + error.message);
        console.error('Paste String Error:', error);
      }
    }

    function findRedundant() {
      const solutionCount = countSolutions(2);
      if (solutionCount !== 1) {
        alert('Must have exactly one solution to find redundant givens');
        return;
      }
      redundantCells.clear();

      const original = grid.map(row => [...row]);
      for (let row = 0; row < 8; row++) {
        for (let col = 0; col < 8; col++) {
          if (grid[row][col] !== 0) {
            const backup = grid[row][col];
            grid[row][col] = 0;
            const testCount = countSolutions(2);
            grid[row][col] = backup;
            if (testCount === 1) {
              redundantCells.add(`${row}-${col}`);
            }
          }
        }
      }
      grid = original;
      renderTable();
      if (redundantCells.size > 0) {
        document.getElementById('status').textContent = `Found ${redundantCells.size} redundant givens (circled)`;
        document.getElementById('status').className = 'status unique';
      } else {
        document.getElementById('status').textContent = 'No redundant givens found';
        document.getElementById('status').className = 'status none';
      }
    }

    function exportToPlay() {
      const puzzleString = gridToString(grid);
      const url = `duodokuplay.html?puzzle=${puzzleString}&zoom=50`;
      window.open(url, '_blank');
    }

    function copyString() {
      const puzzleString = gridToString(grid);
      navigator.clipboard.writeText(puzzleString).then(() => {
        document.getElementById('status').textContent = 'Puzzle string copied to clipboard!';
        document.getElementById('status').className = 'status unique';
      }).catch(err => {
        console.error('Failed to copy string: ', err);
        document.getElementById('status').textContent = 'Failed to copy string.';
        document.getElementById('status').className = 'status none';
      });
    }

    init();
  }

  if (window.DuoDokuTechniques) {
    startApp();
  } else {
    window.addEventListener('duodokutechniques-ready', startApp, { once: true });
  }

  // Theme toggle functionality
  const themeToggle = document.getElementById('themeToggle');
  const body = document.body;

  const savedTheme = localStorage.getItem('theme');
  if (savedTheme === 'light') {
    body.classList.add('light-mode');
    themeToggle.textContent = '☀️';
  }

  themeToggle.addEventListener('click', function () {
    body.classList.toggle('light-mode');
    if (body.classList.contains('light-mode')) {
      themeToggle.textContent = '☀️';
      localStorage.setItem('theme', 'light');
    } else {
      themeToggle.textContent = '🌙';
      localStorage.setItem('theme', 'dark');
    }
  });
</script>
</body>
</html>
