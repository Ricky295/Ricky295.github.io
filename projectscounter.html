<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Summer 2026 DIY Projects Counter</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        header {
            text-align: center;
            color: white;
            margin-bottom: 40px;
            padding: 20px;
        }

        h1 {
            font-size: 3em;
            margin-bottom: 10px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
        }

        .subtitle {
            font-size: 1.2em;
            opacity: 0.9;
        }

        .stats-container {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            margin-bottom: 40px;
        }

        .stat-card {
            background: white;
            border-radius: 15px;
            padding: 25px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            text-align: center;
            transition: transform 0.3s ease;
        }

        .stat-card:hover {
            transform: translateY(-5px);
        }

        .stat-number {
            font-size: 3em;
            font-weight: bold;
            color: #667eea;
            margin-bottom: 10px;
        }

        .stat-label {
            font-size: 1.1em;
            color: #666;
            font-weight: 500;
        }

        .projects-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(350px, 1fr));
            gap: 20px;
            margin-top: 30px;
        }

        .project-card {
            background: white;
            border-radius: 12px;
            padding: 20px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
            transition: all 0.3s ease;
            border-left: 5px solid #667eea;
        }

        .project-card:hover {
            transform: scale(1.02);
            box-shadow: 0 8px 25px rgba(0,0,0,0.2);
        }

        .project-number {
            display: inline-block;
            background: #667eea;
            color: white;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            text-align: center;
            line-height: 40px;
            font-weight: bold;
            margin-bottom: 10px;
        }

        .project-title {
            font-size: 1.3em;
            font-weight: bold;
            color: #333;
            margin-bottom: 10px;
        }

        .project-date {
            color: #666;
            font-size: 0.9em;
            margin-bottom: 8px;
        }

        .project-duration {
            color: #667eea;
            font-size: 0.9em;
            margin-bottom: 10px;
            font-weight: 500;
        }

        .project-note {
            color: #555;
            font-style: italic;
            font-size: 0.95em;
            line-height: 1.4;
            padding: 10px;
            background: #f8f9fa;
            border-radius: 8px;
            margin-top: 10px;
        }

        .loading {
            text-align: center;
            color: white;
            font-size: 1.5em;
            padding: 50px;
        }

        .error {
            text-align: center;
            color: #ff6b6b;
            font-size: 1.2em;
            padding: 30px;
            background: white;
            border-radius: 12px;
            margin: 20px;
        }

        .filter-container {
            text-align: center;
            margin-bottom: 30px;
        }

        .filter-btn {
            background: white;
            border: none;
            padding: 10px 20px;
            margin: 5px;
            border-radius: 25px;
            cursor: pointer;
            font-size: 1em;
            transition: all 0.3s ease;
            box-shadow: 0 3px 10px rgba(0,0,0,0.1);
        }

        .filter-btn:hover {
            background: #667eea;
            color: white;
            transform: translateY(-2px);
        }

        .filter-btn.active {
            background: #667eea;
            color: white;
        }

        @media (max-width: 768px) {
            h1 {
                font-size: 2em;
            }
            
            .projects-grid {
                grid-template-columns: 1fr;
            }
            
            .stats-container {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>🛠️ Summer 2026 DIY Projects</h1>
            <p class="subtitle">Tracking all my creative endeavors this summer!</p>
        </header>

        <div id="loading" class="loading">
            Loading your amazing projects... 🚀
        </div>

        <div id="error" class="error" style="display: none;">
            Oops! Something went wrong loading the projects. Please try again later.
        </div>

        <div id="content" style="display: none;">
            <div class="stats-container">
                <div class="stat-card">
                    <div class="stat-number" id="totalProjects">0</div>
                    <div class="stat-label">Total Projects</div>
                </div>
                <div class="stat-card">
                    <div class="stat-number" id="totalDays">0</div>
                    <div class="stat-label">Active Days</div>
                </div>
                <div class="stat-card">
                    <div class="stat-number" id="avgPerDay">0</div>
                    <div class="stat-label">Avg Projects/Day</div>
                </div>
                <div class="stat-card">
                    <div class="stat-number" id="longestStreak">0</div>
                    <div class="stat-label">Longest Streak (days)</div>
                </div>
            </div>

            <div class="filter-container">
                <button class="filter-btn active" onclick="filterProjects('all')">All Projects</button>
                <button class="filter-btn" onclick="filterProjects('june')">June</button>
                <button class="filter-btn" onclick="filterProjects('july')">July</button>
                <button class="filter-btn" onclick="filterProjects('august')">August</button>
            </div>

            <div class="projects-grid" id="projectsGrid">
                <!-- Projects will be loaded here -->
            </div>
        </div>
    </div>

    <script>
        const API_URL = 'https://script.google.com/macros/s/AKfycbzx-ajWg1PJ7caje_ar_Jaof2d9gipdkxItFMgsGsIbQrp_Uckppjx_yHf5RXMt-w0DbQ/exec';
        
        let allProjects = [];
        let filteredProjects = [];

        async function loadProjects() {
            try {
                const response = await fetch(API_URL);
                const data = await response.json();
                
                if (data.status === 'success') {
                    allProjects = data.data;
                    filteredProjects = [...allProjects];
                    updateStats();
                    renderProjects();
                    document.getElementById('loading').style.display = 'none';
                    document.getElementById('content').style.display = 'block';
                } else {
                    throw new Error('API returned error status');
                }
            } catch (error) {
                console.error('Error loading projects:', error);
                document.getElementById('loading').style.display = 'none';
                document.getElementById('error').style.display = 'block';
            }
        }

        function updateStats() {
            // Total projects
            document.getElementById('totalProjects').textContent = allProjects.length;
            
            // Calculate unique days
            const uniqueDays = new Set(allProjects.map(p => {
                const date = new Date(p.Data);
                return date.toDateString();
            }));
            document.getElementById('totalDays').textContent = uniqueDays.size;
            
            // Average per day
            const avgPerDay = (allProjects.length / uniqueDays.size).toFixed(1);
            document.getElementById('avgPerDay').textContent = avgPerDay;
            
            // Calculate longest streak
            const dates = Array.from(uniqueDays).map(d => new Date(d)).sort((a, b) => a - b);
            let longestStreak = 1;
            let currentStreak = 1;
            
            for (let i = 1; i < dates.length; i++) {
                const diffTime = Math.abs(dates[i] - dates[i-1]);
                const diffDays = Math.ceil(diffTime / (1000 * 60 * 60 * 24));
                
                if (diffDays === 1) {
                    currentStreak++;
                    longestStreak = Math.max(longestStreak, currentStreak);
                } else {
                    currentStreak = 1;
                }
            }
            
            document.getElementById('longestStreak').textContent = longestStreak;
        }

        function formatDate(dateString) {
            const date = new Date(dateString);
            return date.toLocaleDateString('en-US', { 
                weekday: 'short', 
                year: 'numeric', 
                month: 'short', 
                day: 'numeric' 
            });
        }

        function calculateDuration(startStr, endStr) {
            if (!startStr || !endStr) return 'N/A';
            
            const start = new Date(startStr);
            const end = new Date(endStr);
            
            if (isNaN(start.getTime()) || isNaN(end.getTime())) return 'N/A';
            
            const diffMs = end - start;
            const diffMins = Math.floor(diffMs / (1000 * 60));
            const hours = Math.floor(diffMins / 60);
            const mins = diffMins % 60;
            
            if (hours > 0) {
                return `${hours}h ${mins}m`;
            }
            return `${mins}m`;
        }

        function getMonthName(dateString) {
            const date = new Date(dateString);
            const months = ['January', 'February', 'March', 'April', 'May', 'June', 
                          'July', 'August', 'September', 'October', 'November', 'December'];
            return months[date.getMonth()];
        }

        function renderProjects() {
            const grid = document.getElementById('projectsGrid');
            grid.innerHTML = '';
            
            filteredProjects.forEach(project => {
                const card = document.createElement('div');
                card.className = 'project-card';
                
                const duration = calculateDuration(project.Inizio, project.Fine);
                const formattedDate = formatDate(project.Data);
                const note = project.Note ? `<div class="project-note">${project.Note}</div>` : '';
                
                card.innerHTML = `
                    <div class="project-number">${project.Numero}</div>
                    <div class="project-title">${project.Progetto}</div>
                    <div class="project-date">📅 ${formattedDate}</div>
                    <div class="project-duration">⏱️ Duration: ${duration}</div>
                    ${note}
                `;
                
                grid.appendChild(card);
            });
        }

        function filterProjects(month) {
            // Update button states
            document.querySelectorAll('.filter-btn').forEach(btn => {
                btn.classList.remove('active');
            });
            event.target.classList.add('active');
            
            // Filter projects
            if (month === 'all') {
                filteredProjects = [...allProjects];
            } else {
                const monthMap = {
                    'june': 5,
                    'july': 6,
                    'august': 7
                };
                
                filteredProjects = allProjects.filter(project => {
                    const date = new Date(project.Data);
                    return date.getMonth() === monthMap[month];
                });
            }
            
            renderProjects();
        }

        // Load projects when page loads
        window.addEventListener('load', loadProjects);
    </script>
</body>
</html>
