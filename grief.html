<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grief Race Tracker</title>
    <style>
        :root { --bg:#09090d; --panel:#11131b; --panel-2:#181b25; --panel-3:#202432; --red:#ef1b24; --red-dark:#a90e18; --red-glow:rgba(239,27,36,.34); --white:#f7f7fa; --muted:#9da1ae; --line:#343847; --green:#70ef8a; }
        * { margin:0; padding:0; box-sizing:border-box; }
        body { font-family:"Trebuchet MS","Segoe UI",sans-serif; color:var(--white); background:linear-gradient(rgba(255,255,255,.025) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.025) 1px,transparent 1px),radial-gradient(circle at 50% -10%,#3a1017 0,transparent 42%),var(--bg); background-size:32px 32px,32px 32px,auto,auto; min-height:100vh; padding:34px 20px 60px; }
        .container { max-width:980px; margin:0 auto; }
        .brand { text-align:center; margin-bottom:28px; }
        .brand-logo { display:block; width:min(502px,88vw); height:auto; margin:0 auto 12px; filter:drop-shadow(0 7px 0 rgba(0,0,0,.55)) drop-shadow(0 0 20px var(--red-glow)); }
        .brand-kicker { color:var(--muted); font-size:11px; font-weight:800; letter-spacing:4px; text-transform:uppercase; }
        .view-toggle { display:flex; justify-content:center; gap:10px; margin-bottom:24px; }
        .toggle-btn,.back-btn { color:var(--muted); background:var(--panel); border:2px solid var(--line); padding:11px 20px; border-radius:7px; font-size:13px; font-weight:900; letter-spacing:.8px; text-transform:uppercase; cursor:pointer; transition:.2s ease; }
        .toggle-btn:hover,.back-btn:hover { border-color:var(--red); color:var(--white); transform:translateY(-1px); }
        .toggle-btn.active { background:var(--red); border-color:#ff5a5f; color:#fff; box-shadow:0 0 18px var(--red-glow),inset 0 -4px 0 var(--red-dark); }
        .leaderboard-view,.players-view { display:none; }
        .leaderboard-view.show,.players-view.show { display:block; }
        .leaderboard-header { display:flex; justify-content:space-between; align-items:center; gap:20px; margin-bottom:14px; }
        .leaderboard-header::before { content:"RANKINGS"; color:var(--muted); font-size:12px; font-weight:900; letter-spacing:2px; }
        .leaderboard-header > div { display:none; }
        .category-selector { min-width:210px; color:var(--white); background:var(--panel); border:2px solid var(--line); padding:10px 14px; border-radius:7px; font-size:13px; font-weight:800; cursor:pointer; }
        .category-selector:focus { outline:2px solid var(--red); outline-offset:2px; }
        .leaderboard-container { background:rgba(17,19,27,.92); border:1px solid var(--line); border-top:4px solid var(--red); border-radius:10px; padding:18px; box-shadow:0 18px 50px rgba(0,0,0,.3); }
        .leaderboard-entry { display:grid; grid-template-columns:44px 130px 1fr 92px; gap:16px; align-items:center; padding:14px; margin-bottom:9px; background:linear-gradient(90deg,var(--panel-2),var(--panel)); border:1px solid #292d3a; border-left:4px solid transparent; border-radius:7px; cursor:pointer; transition:.2s ease; }
        .leaderboard-entry:last-child { margin-bottom:0; }
        .leaderboard-entry:hover { border-left-color:var(--red); background:var(--panel-3); transform:translateX(4px); }
        .leaderboard-rank { color:var(--red); font-weight:900; font-size:17px; }
        .leaderboard-name { color:var(--white); font-weight:900; letter-spacing:.3px; }
        .leaderboard-stat { color:var(--green); font-weight:900; text-align:right; font-size:13px; }
        .leaderboard-bar,.progress-bar-container { width:100%; height:26px; background:#0b0c11; border:1px solid #303441; border-radius:5px; overflow:hidden; position:relative; box-shadow:inset 0 2px 5px rgba(0,0,0,.45); }
        .leaderboard-bar-fill,.progress-bar-fill { height:100%; background:linear-gradient(90deg,var(--red-dark),var(--red)); transition:width .3s ease; display:flex; align-items:center; justify-content:center; color:#fff; font-size:12px; font-weight:900; text-shadow:0 1px 2px #000; }
        .leaderboard-bar-segment { height:100%; float:left; transition:width .3s ease; display:flex; align-items:center; justify-content:center; font-size:10px; font-weight:900; color:#fff; position:relative; cursor:help; overflow:hidden; min-width:0; }
        .leaderboard-bar-segment:hover::after { content:attr(data-tooltip); position:absolute; bottom:100%; left:50%; transform:translateX(-50%); background:#07080b; color:#fff; padding:5px 8px; border-radius:4px; font-size:11px; white-space:nowrap; z-index:10; border:1px solid var(--red); margin-bottom:5px; }
        .leaderboard-bar-segment.gray { background:#4c505b; }
        .leaderboard-bar-segment.green { background:linear-gradient(90deg,var(--red-dark),var(--red)); }
        .players-grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(350px,1fr)); gap:18px; }
        .player-card { background:rgba(17,19,27,.94); border:1px solid var(--line); border-top:4px solid var(--red); border-radius:10px; padding:22px; cursor:pointer; transition:.2s ease; }
        .player-card:hover { transform:translateY(-3px); box-shadow:0 12px 30px rgba(0,0,0,.35); }
        .player-card.no-start { border-top-color:#555; opacity:.55; }
        .player-card.no-start:hover { cursor:not-allowed; transform:none; }
        .player-name { color:var(--white); font-size:20px; font-weight:900; margin-bottom:20px; letter-spacing:.4px; }
        .player-card:not(.no-start) .player-name::before { content:"●"; color:var(--red); font-size:12px; margin-right:9px; vertical-align:2px; }
        .player-card.no-start .player-name { color:#999; }
        .metric { margin-bottom:22px; }
        .metric-label { color:var(--muted); font-size:11px; text-transform:uppercase; letter-spacing:1.4px; margin-bottom:8px; font-weight:900; }
        .runs-list { color:var(--muted); font-size:12px; margin-top:7px; line-height:1.6; }
        .run-segment { display:inline-block; background:var(--panel-3); border:1px solid #343847; padding:3px 8px; border-radius:4px; margin-right:5px; margin-bottom:4px; }
        .no-data { color:#666; font-style:italic; padding:18px; text-align:center; }
        .back-btn { display:none; margin-bottom:18px; background:var(--red); color:#fff; border-color:#ff5a5f; }
        .players-view.show .back-btn { display:inline-block; }
        @media (max-width:640px) { body{padding:24px 12px 40px;} .brand-logo{width:94vw;} .brand-kicker{letter-spacing:2px;font-size:10px;} .view-toggle{gap:7px;} .toggle-btn{padding:10px 12px;font-size:11px;} .leaderboard-header{margin-bottom:10px;} .leaderboard-header::before{font-size:10px;letter-spacing:1px;} .category-selector{min-width:0;width:165px;font-size:11px;padding:9px 7px;} .leaderboard-container{padding:10px;} .leaderboard-entry{grid-template-columns:25px minmax(64px,1fr) minmax(90px,2fr) 55px;gap:7px;padding:10px 7px;} .leaderboard-name,.leaderboard-stat{font-size:11px;} .leaderboard-bar-segment{font-size:8px;} .players-grid{grid-template-columns:1fr;} }
    </style>
</head>

            <div class="brand-kicker">Race to first victor</div>

        <div class="view-toggle">
            <button class="toggle-btn active" onclick="showLeaderboard()">Leaderboard</button>
            <button class="toggle-btn" onclick="showPlayers()">Players</button>
        </div>

        <!-- LEADERBOARD VIEW -->
        <div class="leaderboard-view show">
            <div class="leaderboard-header">
                <div style="flex: 1;"></div>
                <select class="category-selector" onchange="changeCategory(this.value)">
                    <option value="percentFrom0">% from 0</option>
                    <option value="totalPercent">Total Unique %</option>
                    <option value="runs">Runs</option>
                </select>
            </div>

            <div class="leaderboard-container" id="leaderboardContainer"></div>
        </div>

        <!-- PLAYERS VIEW -->
        <div class="players-view">
            <button class="back-btn" onclick="showLeaderboard()">← Back</button>
            <div class="players-grid" id="playersGrid"></div>
        </div>

    <script>
        const playerData = {
            'dewbbs': {
                percentFrom0: 46,
                runs: [[0, 46], [35, 77], [49, 100]],
            },
            'zoink': {
                percentFrom0: 18,
                runs: [[0, 18], [21, 43], [44, 79], [75, 100]],
            },
            'trick': {
                percentFrom0: 29,
                runs: [[0, 29], [56, 100]],
            },
            'wPopOff': {
                percentFrom0: 18,
                runs: [[0, 18], [55, 82], [71, 100]],
            },
            'cursed': null,
            'slayraius': {
                percentFrom0: 38,
                runs: [[0, 38], [44, 100]],
            },
        };

        let currentCategory = 'percentFrom0';

        function showLeaderboard() {
            document.querySelector('.leaderboard-view').classList.add('show');
            document.querySelector('.players-view').classList.remove('show');
            document.querySelectorAll('.toggle-btn')[0].classList.add('active');
            document.querySelectorAll('.toggle-btn')[1].classList.remove('active');
        }

        function showPlayers() {
            document.querySelector('.leaderboard-view').classList.remove('show');
            document.querySelector('.players-view').classList.add('show');
            document.querySelectorAll('.toggle-btn')[0].classList.remove('active');
            document.querySelectorAll('.toggle-btn')[1].classList.add('active');
        }

        function changeCategory(category) {
            currentCategory = category;
            renderLeaderboard();
        }

        function showPlayerCard(playerName) {
            showPlayers();
            setTimeout(() => {
                document.getElementById(`card-${playerName}`).scrollIntoView({ behavior: 'smooth' });
            }, 100);
        }

        function normalizeRuns(runs) {
            return (Array.isArray(runs) ? runs : [])
                .filter(run => Array.isArray(run) && run.length >= 2)
                .map(([start, end]) => [Number(start), Number(end)])
                .filter(([start, end]) => Number.isFinite(start) && Number.isFinite(end))
                .map(([start, end]) => [Math.max(0, Math.min(100, start)), Math.max(0, Math.min(100, end))])
                .map(([start, end]) => start <= end ? [start, end] : [end, start]);
        }

        function mergeRuns(runs) {
            const sorted = normalizeRuns(runs).sort((a, b) => a[0] - b[0] || a[1] - b[1]);
            const merged = [];
            sorted.forEach(([start, end]) => {
                const last = merged[merged.length - 1];
                if (last && start <= last[1]) {
                    last[1] = Math.max(last[1], end);
                } else {
                    merged.push([start, end]);
                }
            });
            return merged;
        }

        function calculateTotalPercent(runs) {
            return mergeRuns(runs).reduce((sum, [start, end]) => sum + (end - start), 0);
        }

        function getRunsSegments(runs) {
            const merged = mergeRuns(runs);
            if (merged.length === 0) return [];

            // Include gaps so the bar accurately shows progress versus uncovered sections.
            const points = new Set([0, 100]);
            merged.forEach(([start, end]) => { points.add(start); points.add(end); });
            const sortedPoints = Array.from(points).sort((a, b) => a - b);
            const segments = [];
            for (let i = 0; i < sortedPoints.length - 1; i++) {
                const start = sortedPoints[i];
                const end = sortedPoints[i + 1];
                const covered = merged.some(([runStart, runEnd]) => start >= runStart && end <= runEnd);
                segments.push({ start, end, covered });
            }
            return segments;
        }

        function renderLeaderboard() {
            const container = document.getElementById('leaderboardContainer');
            container.innerHTML = '';

            // Get all players with data
            const playersWithData = Object.entries(playerData)
                .filter(([_, data]) => data !== null)
                .map(([name, data]) => {
                    const totalPercent = calculateTotalPercent(data.runs);
                    return {
                        name,
                        percentFrom0: data.percentFrom0,
                        totalPercent,
                        runsCount: data.runs.length,
                        data
                    };
                });

            // Sort based on category
            let sorted = [];
            if (currentCategory === 'percentFrom0') {
                sorted = playersWithData.sort((a, b) => b.percentFrom0 - a.percentFrom0);
            } else if (currentCategory === 'totalPercent') {
                sorted = playersWithData.sort((a, b) => {
                    if (b.totalPercent !== a.totalPercent) {
                        return b.totalPercent - a.totalPercent;
                    }
                    return a.runsCount - b.runsCount; // If tied, least runs wins
                });
            } else if (currentCategory === 'runs') {
                // Overall unique progress ranks first; fewer runs breaks ties.
                sorted = playersWithData.sort((a, b) => {
                    if (b.totalPercent !== a.totalPercent) {
                        return b.totalPercent - a.totalPercent;
                    }
                    return a.runsCount - b.runsCount;
                });
            }

            // Add cursed at the end
            sorted.push({ name: 'cursed', percentFrom0: 0, totalPercent: 0, runsCount: 0, data: null });

            // Render entries
            sorted.forEach((player, index) => {
                const entry = document.createElement('div');
                entry.className = 'leaderboard-entry';
                entry.onclick = () => showPlayerCard(player.name);

                const rankEl = document.createElement('div');
                rankEl.className = 'leaderboard-rank';
                rankEl.textContent = (index + 1) + '.';
                entry.appendChild(rankEl);

                const nameEl = document.createElement('div');
                nameEl.className = 'leaderboard-name';
                nameEl.textContent = player.name;
                entry.appendChild(nameEl);

                const barEl = document.createElement('div');
                barEl.className = 'leaderboard-bar';

                if (currentCategory === 'runs' && player.data) {
                    // Segmented bar for runs
                    const segments = getRunsSegments(player.data.runs);
                    segments.forEach((segment, idx) => {
                        const segEl = document.createElement('div');
                        segEl.className = 'leaderboard-bar-segment ' + (segment.covered ? 'green' : 'gray');
                        segEl.style.width = (segment.end - segment.start) + '%';
                        segEl.setAttribute('data-tooltip', segment.covered ? `${segment.start}-${segment.end}% progress` : `${segment.start}-${segment.end}% gap`);
                        segEl.textContent = segment.covered ? `${segment.start}-${segment.end}%` : '';
                        barEl.appendChild(segEl);
                    });
                } else {
                    // Single bar for percent from 0 or total percent
                    const barFillEl = document.createElement('div');
                    barFillEl.className = 'leaderboard-bar-fill';

                    let value = 0;
                    let label = '';

                    if (currentCategory === 'percentFrom0') {
                        value = player.percentFrom0;
                        label = value + '%';
                    } else if (currentCategory === 'totalPercent') {
                        value = player.totalPercent;
                        label = value.toFixed(0) + '%';
                    }

                    barFillEl.style.width = (value > 0 ? value : 5) + '%'; // Min 5% for visibility
                    barFillEl.textContent = label;
                    barEl.appendChild(barFillEl);
                }
                entry.appendChild(barEl);

                const statEl = document.createElement('div');
                statEl.className = 'leaderboard-stat';
                if (player.name === 'cursed') {
                    statEl.textContent = '—';
                } else if (currentCategory === 'percentFrom0') {
                    statEl.textContent = player.percentFrom0 + '%';
                } else if (currentCategory === 'totalPercent') {
                    statEl.textContent = player.totalPercent.toFixed(0) + '%';
                } else {
                    statEl.textContent = player.runsCount + ' runs';
                }
                entry.appendChild(statEl);

                container.appendChild(entry);
            });
        }

        function renderPlayer(name, data) {
            const card = document.createElement('div');
            card.id = `card-${name}`;
            card.className = data ? 'player-card' : 'player-card no-start';

            const nameEl = document.createElement('div');
            nameEl.className = 'player-name';
            nameEl.textContent = name;
            card.appendChild(nameEl);

            if (!data) {
                const noDataEl = document.createElement('div');
                noDataEl.className = 'no-data';
                noDataEl.textContent = 'Did not start';
                card.appendChild(noDataEl);
                return card;
            }

            // Percent from 0
            const percentMetric = document.createElement('div');
            percentMetric.className = 'metric';
            percentMetric.innerHTML = '<div class="metric-label">Percent from 0</div>';
            const percentContainer = document.createElement('div');
            percentContainer.className = 'progress-bar-container';
            const percentFill = document.createElement('div');
            percentFill.className = 'progress-bar-fill';
            percentFill.style.width = data.percentFrom0 + '%';
            percentFill.textContent = data.percentFrom0 + '%';
            percentContainer.appendChild(percentFill);
            percentMetric.appendChild(percentContainer);
            card.appendChild(percentMetric);

            // Runs - list
            const runsMetric = document.createElement('div');
            runsMetric.className = 'metric';
            runsMetric.innerHTML = '<div class="metric-label">Runs</div>';
            const runsList = document.createElement('div');
            runsList.className = 'runs-list';
            data.runs.forEach((run) => {
                const span = document.createElement('span');
                span.className = 'run-segment';
                span.textContent = `${run[0]}-${run[1]}%`;
                runsList.appendChild(span);
            });
            runsMetric.appendChild(runsList);
            card.appendChild(runsMetric);

            // Runs - segmented bar
            const runsBarMetric = document.createElement('div');
            runsBarMetric.className = 'metric';
            const runsBar = document.createElement('div');
            runsBar.className = 'leaderboard-bar';
            const segments = getRunsSegments(data.runs);
            segments.forEach((segment, idx) => {
                const segEl = document.createElement('div');
                segEl.className = 'leaderboard-bar-segment ' + (segment.covered ? 'green' : 'gray');
                segEl.style.width = (segment.end - segment.start) + '%';
                segEl.setAttribute('data-tooltip', segment.covered ? `${segment.start}-${segment.end}% progress` : `${segment.start}-${segment.end}% gap`);
                segEl.textContent = segment.covered ? `${segment.start}-${segment.end}%` : '';
                runsBar.appendChild(segEl);
            });
            runsBarMetric.appendChild(runsBar);
            card.appendChild(runsBarMetric);

            // Total unique percent
            const totalPercent = calculateTotalPercent(data.runs);
            const totalMetric = document.createElement('div');
            totalMetric.className = 'metric';
            totalMetric.innerHTML = '<div class="metric-label">Total Unique %</div>';
            const totalContainer = document.createElement('div');
            totalContainer.className = 'progress-bar-container';
            const totalFill = document.createElement('div');
            totalFill.className = 'progress-bar-fill';
            totalFill.style.width = totalPercent + '%';
            totalFill.textContent = totalPercent.toFixed(0) + '% in ' + data.runs.length + ' runs';
            totalContainer.appendChild(totalFill);
            totalMetric.appendChild(totalContainer);
            card.appendChild(totalMetric);

            return card;
        }

        // Initial render
        const grid = document.getElementById('playersGrid');
        Object.entries(playerData).forEach(([name, data]) => {
            grid.appendChild(renderPlayer(name, data));
        });

        renderLeaderboard();
    </script>
</body>
</html>
