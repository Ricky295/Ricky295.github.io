<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Island Minesweeper</title>
<style>
  :root{
    --ocean-deep:#083a52;
    --ocean-mid:#0e5578;
    --ocean-shallow:#1c7ca3;
    --sand:#e9d7a3;
    --sand-dark:#c9b378;
    --palm:#2f7a4f;
    --palm-dark:#1f5c3a;
    --ink:#0b2733;
    --paper:#fbf3dd;
    --coral:#e8654a;
    --coral-dark:#c94a32;
    --flag:#d63b3b;
  }
  *{box-sizing:border-box;}
  html,body{height:100%;}
  body{
    margin:0;
    min-height:100vh;
    display:flex;
    flex-direction:column;
    align-items:center;
    font-family:'Trebuchet MS','Segoe UI',sans-serif;
    color:var(--paper);
    background:
      radial-gradient(circle at 20% 15%, rgba(255,255,255,0.05), transparent 40%),
      linear-gradient(180deg, var(--ocean-deep), var(--ocean-mid) 60%, var(--ocean-shallow));
    background-attachment:fixed;
    overflow-x:hidden;
  }

  /* subtle animated wave texture */
  .waves{
    position:fixed;
    inset:0;
    pointer-events:none;
    opacity:0.12;
    background-image:
      repeating-linear-gradient(45deg, transparent 0 18px, rgba(255,255,255,0.5) 18px 19px),
      repeating-linear-gradient(-45deg, transparent 0 24px, rgba(255,255,255,0.4) 24px 25px);
    animation: driftWaves 30s linear infinite;
    z-index:0;
  }
  @keyframes driftWaves{
    0%{background-position:0 0, 0 0;}
    100%{background-position:200px 200px, -200px 200px;}
  }

  header{
    width:100%;
    text-align:center;
    padding:22px 16px 10px;
    z-index:1;
  }
  h1{
    margin:0;
    font-family:'Georgia',serif;
    font-weight:900;
    font-size:clamp(1.6rem, 4vw, 2.4rem);
    letter-spacing:0.5px;
    color:var(--sand);
    text-shadow: 0 3px 0 rgba(0,0,0,0.25);
  }
  h1 span{color:var(--coral);}
  .sub{
    margin:6px 0 0;
    font-size:0.85rem;
    color:rgba(251,243,221,0.75);
    letter-spacing:0.3px;
  }

  .panel{
    z-index:1;
    background:rgba(11,39,51,0.55);
    border:1px solid rgba(233,215,163,0.25);
    backdrop-filter: blur(6px);
    border-radius:16px;
    padding:16px 20px;
    margin:14px 12px;
    display:flex;
    flex-wrap:wrap;
    gap:18px;
    align-items:flex-end;
    justify-content:center;
    box-shadow:0 8px 24px rgba(0,0,0,0.25);
    max-width:900px;
    width:calc(100% - 24px);
  }
  .field{
    display:flex;
    flex-direction:column;
    gap:6px;
    min-width:150px;
  }
  .field label{
    font-size:0.72rem;
    text-transform:uppercase;
    letter-spacing:0.08em;
    color:var(--sand);
    font-weight:700;
  }
  .field .row{
    display:flex;
    align-items:center;
    gap:8px;
  }
  input[type="range"]{
    accent-color:var(--coral);
    flex:1;
  }
  .val{
    font-family:'Courier New', monospace;
    font-weight:700;
    color:var(--paper);
    min-width:38px;
    text-align:right;
    font-size:0.9rem;
  }
  select{
    background:var(--ink);
    color:var(--paper);
    border:1px solid rgba(233,215,163,0.4);
    border-radius:8px;
    padding:7px 8px;
    font-size:0.85rem;
  }

  button{
    font-family:inherit;
    font-weight:800;
    letter-spacing:0.03em;
    border:none;
    border-radius:10px;
    padding:11px 20px;
    cursor:pointer;
    font-size:0.9rem;
    transition:transform 0.08s ease, box-shadow 0.15s ease;
    box-shadow:0 4px 0 rgba(0,0,0,0.25);
  }
  button:active{ transform:translateY(3px); box-shadow:0 1px 0 rgba(0,0,0,0.25); }
  #newGameBtn{
    background:linear-gradient(180deg, var(--coral), var(--coral-dark));
    color:var(--paper);
  }

  .status-bar{
    z-index:1;
    display:flex;
    align-items:center;
    gap:20px;
    margin:0 0 14px;
    flex-wrap:wrap;
    justify-content:center;
  }
  .chip{
    background:rgba(11,39,51,0.6);
    border:1px solid rgba(233,215,163,0.3);
    border-radius:10px;
    padding:8px 16px;
    display:flex;
    align-items:center;
    gap:8px;
    font-family:'Courier New', monospace;
    font-weight:700;
    font-size:1.05rem;
  }
  .chip .icon{font-size:1.1rem;}
  .face-btn{
    font-size:1.6rem;
    background:var(--sand);
    border:2px solid var(--sand-dark);
    border-radius:50%;
    width:52px;
    height:52px;
    display:flex;
    align-items:center;
    justify-content:center;
    cursor:pointer;
    box-shadow:0 4px 0 rgba(0,0,0,0.25);
  }
  .face-btn:active{ transform:translateY(3px); box-shadow:none; }

  #message{
    z-index:1;
    min-height:1.6em;
    font-weight:800;
    font-size:1.15rem;
    margin-bottom:8px;
    text-align:center;
    text-shadow:0 2px 0 rgba(0,0,0,0.3);
  }
  #message.win{color:#8ff0c1;}
  #message.lose{color:#ff9d8a;}

  #boardWrap{
    z-index:1;
    background:linear-gradient(180deg, rgba(11,39,51,0.4), rgba(11,39,51,0.15));
    border-radius:20px;
    padding:14px;
    margin-bottom:40px;
    box-shadow:inset 0 0 40px rgba(0,0,0,0.3), 0 12px 30px rgba(0,0,0,0.3);
    max-width:96vw;
    overflow:auto;
  }
  #board{
    display:grid;
    gap:1px;
    background:rgba(8,58,82,0.6);
    border-radius:8px;
    overflow:hidden;
  }
  .cell{
    width:28px;
    height:28px;
    display:flex;
    align-items:center;
    justify-content:center;
    font-weight:800;
    font-size:0.95rem;
    user-select:none;
    position:relative;
    font-family:'Trebuchet MS', sans-serif;
  }
  .cell.ocean{
    background:transparent;
    cursor:default;
  }
  .cell.land{
    background:linear-gradient(160deg, var(--palm), var(--palm-dark));
    cursor:pointer;
    box-shadow: inset 0 2px 0 rgba(255,255,255,0.15), inset 0 -3px 0 rgba(0,0,0,0.25);
  }
  .cell.land:hover{
    filter:brightness(1.12);
  }
  .cell.revealed{
    background:linear-gradient(160deg, var(--sand), var(--sand-dark));
    box-shadow: inset 0 2px 4px rgba(0,0,0,0.25);
    cursor:default;
    color:var(--ink);
  }
  .cell.revealed.n1{color:#0e5578;}
  .cell.revealed.n2{color:#1f5c3a;}
  .cell.revealed.n3{color:#c94a32;}
  .cell.revealed.n4{color:#5b2e8f;}
  .cell.revealed.n5{color:#8f2e2e;}
  .cell.revealed.n6{color:#1a8f8f;}
  .cell.revealed.n7{color:#2b2b2b;}
  .cell.revealed.n8{color:#8f6f2e;}

  .cell.mine{
    background:linear-gradient(160deg, var(--coral), var(--coral-dark));
  }
  .cell.flagged::after{
    content:'⚑';
    color:var(--flag);
    font-size:1.05rem;
    text-shadow:0 1px 1px rgba(0,0,0,0.4);
  }
  .cell.exploded{
    background:linear-gradient(160deg, #ff5252, #a11d1d);
    animation: boom 0.3s ease;
  }
  @keyframes boom{
    0%{transform:scale(1.4);}
    100%{transform:scale(1);}
  }

  footer{
    z-index:1;
    text-align:center;
    color:rgba(251,243,221,0.5);
    font-size:0.75rem;
    padding-bottom:20px;
  }

  @media (max-width:600px){
    .cell{width:22px;height:22px;font-size:0.8rem;}
  }
</style>
</head>
<body>
<div class="waves"></div>

<header>
  <h1>🏝️ Island <span>Minesweeper</span></h1>
  <p class="sub">Every board is a freshly grown island — sweep the sand, dodge the crabs.</p>
</header>

<div class="panel">
  <div class="field">
    <label for="sizeSlider">Island Size (cells)</label>
    <div class="row">
      <input id="sizeSlider" type="range" min="20" max="600" step="5" value="120">
      <span class="val" id="sizeVal">120</span>
    </div>
  </div>
  <div class="field">
    <label for="mineSlider">Number of Mines</label>
    <div class="row">
      <input id="mineSlider" type="range" min="1" max="60" step="1" value="15">
      <span class="val" id="mineVal">15</span>
    </div>
  </div>
  <div class="field">
    <label for="shapeSelect">Island Shape</label>
    <select id="shapeSelect">
      <option value="0.59" selected>Balanced (rounded)</option>
      <option value="0.52">Wispy / fragmented</option>
      <option value="0.68">Dense / blobby</option>
      <option value="0.75">Solid landmass</option>
    </select>
  </div>
  <button id="newGameBtn">🌴 Grow New Island</button>
</div>

<div class="status-bar">
  <div class="chip"><span class="icon">🚩</span><span id="flagsLeft">15</span></div>
  <button class="face-btn" id="faceBtn">🙂</button>
  <div class="chip"><span class="icon">⏱️</span><span id="timer">0</span></div>
</div>

<div id="message"></div>

<div id="boardWrap">
  <div id="board"></div>
</div>

<footer>Left click to dig · Right click to flag · Click a revealed number when flags match to auto-clear neighbors · Land generated via recursive BFS spreading</footer>

<script>
(function(){
  const sizeSlider = document.getElementById('sizeSlider');
  const mineSlider = document.getElementById('mineSlider');
  const sizeVal = document.getElementById('sizeVal');
  const mineVal = document.getElementById('mineVal');
  const shapeSelect = document.getElementById('shapeSelect');
  const newGameBtn = document.getElementById('newGameBtn');
  const faceBtn = document.getElementById('faceBtn');
  const boardEl = document.getElementById('board');
  const flagsLeftEl = document.getElementById('flagsLeft');
  const timerEl = document.getElementById('timer');
  const messageEl = document.getElementById('message');

  let grid = [];        // grid[y][x] = { land, mine, revealed, flagged, adj }
  let gridWidth = 0;
  let gridHeight = 0;
  let landCells = [];
  let totalLand = 0;
  let totalMines = 0;
  let flagsPlaced = 0;
  let revealedCount = 0;
  let firstClick = true;
  let gameOver = false;
  let timerInterval = null;
  let seconds = 0;

  sizeSlider.addEventListener('input', () => {
    sizeVal.textContent = sizeSlider.value;
    clampMines();
  });
  mineSlider.addEventListener('input', () => { mineVal.textContent = mineSlider.value; });
  newGameBtn.addEventListener('click', startGame);
  faceBtn.addEventListener('click', startGame);

  function clampMines(){
    const maxMines = Math.max(1, Math.floor(parseInt(sizeSlider.value) * 0.35));
    if(parseInt(mineSlider.value) > maxMines){
      mineSlider.value = maxMines;
      mineVal.textContent = maxMines;
    }
    mineSlider.max = Math.min(200, maxMines);
  }
  clampMines();

  /**
   * Island generation — adapted from the recursive BFS spreading algorithm:
   * grow land outward from a center point, each neighbor has `prob` chance
   * of becoming land, bounded strictly by maxAreaCells.
   */
  function generateIslandShape(maxAreaCells, prob){
    const gridRadius = Math.min(40, Math.max(6, Math.ceil(Math.sqrt(maxAreaCells) * 1.8)));
    const dim = gridRadius * 2 + 1;
    const center = gridRadius;
    const visited = new Set();
    const landSet = new Set();

    const directions = [[1,0],[-1,0],[0,1],[0,-1]];

    let queue = [{x:center, y:center}];
    visited.add(`${center},${center}`);
    let landCount = 0;

    while(queue.length > 0 && landCount < maxAreaCells){
      const currentBatch = queue;
      queue = [];
      for(const cell of currentBatch){
        if(landCount >= maxAreaCells) break;
        landSet.add(`${cell.x},${cell.y}`);
        landCount++;

        for(const [dx, dy] of directions){
          if(landCount + queue.length >= maxAreaCells) break;
          const nx = cell.x + dx;
          const ny = cell.y + dy;
          const key = `${nx},${ny}`;
          if(nx >= 0 && nx < dim && ny >= 0 && ny < dim && !visited.has(key)){
            if(Math.random() < prob){
              visited.add(key);
              queue.push({x:nx, y:ny});
            }
          }
        }
      }
    }

    return cropToLand(dim, landSet);
  }

  // Trim empty border rows/columns so the board is as tight as possible
  function cropToLand(dim, landSet){
    let minX = dim, maxX = -1, minY = dim, maxY = -1;
    for(const key of landSet){
      const [x, y] = key.split(',').map(Number);
      if(x < minX) minX = x;
      if(x > maxX) maxX = x;
      if(y < minY) minY = y;
      if(y > maxY) maxY = y;
    }
    const newSet = new Set();
    for(const key of landSet){
      const [x, y] = key.split(',').map(Number);
      newSet.add(`${x-minX},${y-minY}`);
    }
    const width = maxX - minX + 1;
    const height = maxY - minY + 1;
    return { dim: Math.max(width, height), width, height, landSet: newSet };
  }

  function startGame(){
    clearInterval(timerInterval);
    seconds = 0;
    timerEl.textContent = '0';
    gameOver = false;
    firstClick = true;
    messageEl.textContent = '';
    messageEl.className = '';
    faceBtn.textContent = '🙂';

    const targetSize = parseInt(sizeSlider.value);
    totalMines = parseInt(mineSlider.value);
    const prob = parseFloat(shapeSelect.value);

    // Generate island shape; retry if it comes out too small to fit mines.
    let width, height, landSet;
    let attempts = 0;
    do {
      const result = generateIslandShape(targetSize, prob);
      width = result.width;
      height = result.height;
      landSet = result.landSet;
      attempts++;
    } while(landSet.size < Math.min(targetSize, totalMines + 9) && attempts < 25);

    gridWidth = width;
    gridHeight = height;
    totalLand = landSet.size;
    if(totalMines > totalLand - 1) totalMines = Math.max(1, totalLand - 1);
    flagsPlaced = 0;
    revealedCount = 0;
    flagsLeftEl.textContent = totalMines - flagsPlaced;

    // Build grid
    grid = [];
    landCells = [];
    for(let y = 0; y < gridHeight; y++){
      const row = [];
      for(let x = 0; x < gridWidth; x++){
        const isLand = landSet.has(`${x},${y}`);
        row.push({ land:isLand, mine:false, revealed:false, flagged:false, adj:0 });
        if(isLand) landCells.push({x,y});
      }
      grid.push(row);
    }

    renderBoard();
  }

  function placeMines(excludeX, excludeY){
    // exclude the clicked cell and its neighbors from mine placement
    const excluded = new Set();
    for(let dy = -1; dy <= 1; dy++){
      for(let dx = -1; dx <= 1; dx++){
        excluded.add(`${excludeX+dx},${excludeY+dy}`);
      }
    }
    const candidates = landCells.filter(c => !excluded.has(`${c.x},${c.y}`));
    const pool = candidates.length >= totalMines ? candidates : landCells.filter(c => `${c.x},${c.y}` !== `${excludeX},${excludeY}`);

    const shuffled = pool.slice();
    for(let i = shuffled.length - 1; i > 0; i--){
      const j = Math.floor(Math.random() * (i+1));
      [shuffled[i], shuffled[j]] = [shuffled[j], shuffled[i]];
    }
    const chosen = shuffled.slice(0, totalMines);
    for(const c of chosen){ grid[c.y][c.x].mine = true; }

    // compute adjacency counts
    for(const c of landCells){
      let count = 0;
      for(let dy = -1; dy <= 1; dy++){
        for(let dx = -1; dx <= 1; dx++){
          if(dx === 0 && dy === 0) continue;
          const nx = c.x+dx, ny = c.y+dy;
          if(nx >= 0 && nx < gridWidth && ny >= 0 && ny < gridHeight && grid[ny][nx].land && grid[ny][nx].mine){
            count++;
          }
        }
      }
      grid[c.y][c.x].adj = count;
    }
  }

  function renderBoard(){
    boardEl.style.gridTemplateColumns = `repeat(${gridWidth}, 28px)`;
    boardEl.innerHTML = '';
    for(let y = 0; y < gridHeight; y++){
      for(let x = 0; x < gridWidth; x++){
        const cellData = grid[y][x];
        const div = document.createElement('div');
        div.className = 'cell ' + (cellData.land ? 'land' : 'ocean');
        div.dataset.x = x;
        div.dataset.y = y;
        if(cellData.land){
          div.addEventListener('click', onCellClick);
          div.addEventListener('contextmenu', onCellRightClick);
          div.addEventListener('dblclick', onCellChord);
        }
        boardEl.appendChild(div);
      }
    }
  }

  function startTimer(){
    timerInterval = setInterval(() => {
      seconds++;
      timerEl.textContent = seconds;
    }, 1000);
  }

  function onCellClick(e){
    if(gameOver) return;
    const x = parseInt(e.currentTarget.dataset.x);
    const y = parseInt(e.currentTarget.dataset.y);
    const cell = grid[y][x];
    if(cell.revealed){
      // Clicking an already-revealed number chords it if flags match
      chordReveal(x, y);
      checkWin();
      return;
    }
    if(cell.flagged) return;

    if(firstClick){
      placeMines(x, y);
      firstClick = false;
      startTimer();
    }

    if(cell.mine){
      revealAllMines(x, y);
      endGame(false);
      return;
    }

    floodReveal(x, y);
    checkWin();
  }

  function onCellChord(e){
    if(gameOver) return;
    const x = parseInt(e.currentTarget.dataset.x);
    const y = parseInt(e.currentTarget.dataset.y);
    chordReveal(x, y);
    checkWin();
  }

  function getNeighbors(x, y){
    const result = [];
    for(let dy = -1; dy <= 1; dy++){
      for(let dx = -1; dx <= 1; dx++){
        if(dx === 0 && dy === 0) continue;
        const nx = x+dx, ny = y+dy;
        if(nx >= 0 && nx < gridWidth && ny >= 0 && ny < gridHeight && grid[ny][nx].land){
          result.push({x:nx, y:ny});
        }
      }
    }
    return result;
  }

  // Chord: if a revealed number's flag count matches its number, reveal all
  // remaining unflagged neighbors. Mirrors classic minesweeper middle-click.
  function chordReveal(x, y){
    const cell = grid[y][x];
    if(!cell.revealed || cell.adj === 0) return;

    const neighbors = getNeighbors(x, y);
    const flaggedCount = neighbors.filter(n => grid[n.y][n.x].flagged).length;
    if(flaggedCount !== cell.adj) return;

    for(const n of neighbors){
      const nCell = grid[n.y][n.x];
      if(nCell.flagged || nCell.revealed) continue;
      if(nCell.mine){
        revealAllMines(n.x, n.y);
        endGame(false);
        return;
      }
      floodReveal(n.x, n.y);
    }
  }

  function onCellRightClick(e){
    e.preventDefault();
    if(gameOver) return;
    const x = parseInt(e.currentTarget.dataset.x);
    const y = parseInt(e.currentTarget.dataset.y);
    const cell = grid[y][x];
    if(cell.revealed) return;

    if(cell.flagged){
      cell.flagged = false;
      flagsPlaced--;
    } else {
      if(flagsPlaced >= totalMines) return;
      cell.flagged = true;
      flagsPlaced++;
    }
    flagsLeftEl.textContent = totalMines - flagsPlaced;
    updateCellDOM(x, y);
  }

  function floodReveal(startX, startY){
    const stack = [{x:startX, y:startY}];
    const seen = new Set();
    while(stack.length){
      const {x, y} = stack.pop();
      const key = `${x},${y}`;
      if(seen.has(key)) continue;
      seen.add(key);
      const cell = grid[y][x];
      if(!cell.land || cell.revealed || cell.flagged) continue;
      cell.revealed = true;
      revealedCount++;
      updateCellDOM(x, y);
      if(cell.adj === 0){
        for(let dy = -1; dy <= 1; dy++){
          for(let dx = -1; dx <= 1; dx++){
            if(dx === 0 && dy === 0) continue;
            const nx = x+dx, ny = y+dy;
            if(nx >= 0 && nx < gridWidth && ny >= 0 && ny < gridHeight && grid[ny][nx].land && !grid[ny][nx].revealed){
              stack.push({x:nx, y:ny});
            }
          }
        }
      }
    }
  }

  function updateCellDOM(x, y){
    const div = boardEl.children[y * gridWidth + x];
    const cell = grid[y][x];
    div.className = 'cell land';
    if(cell.revealed){
      div.classList.remove('land');
      div.classList.add('revealed');
      if(cell.mine){
        div.classList.add('mine');
        div.textContent = '🦀';
      } else if(cell.adj > 0){
        div.classList.add('n' + cell.adj);
        div.textContent = cell.adj;
      } else {
        div.textContent = '';
      }
    } else if(cell.flagged){
      div.classList.add('flagged');
      div.textContent = '';
    } else {
      div.textContent = '';
    }
  }

  function revealAllMines(explodedX, explodedY){
    for(const c of landCells){
      const cell = grid[c.y][c.x];
      if(cell.mine){
        cell.revealed = true;
        updateCellDOM(c.x, c.y);
        if(c.x === explodedX && c.y === explodedY){
          boardEl.children[c.y * gridWidth + c.x].classList.add('exploded');
        }
      } else if(cell.flagged && !cell.mine){
        // show incorrect flags
        const div = boardEl.children[c.y * gridWidth + c.x];
        div.textContent = '❌';
      }
    }
  }

  function checkWin(){
    const safeCells = totalLand - totalMines;
    if(revealedCount >= safeCells){
      endGame(true);
    }
  }

  function endGame(won){
    gameOver = true;
    clearInterval(timerInterval);
    if(won){
      messageEl.textContent = '🏆 Island fully charted! You win!';
      messageEl.className = 'win';
      faceBtn.textContent = '😎';
      // auto-flag remaining mines
      for(const c of landCells){
        const cell = grid[c.y][c.x];
        if(cell.mine && !cell.flagged){
          cell.flagged = true;
          updateCellDOM(c.x, c.y);
        }
      }
      flagsLeftEl.textContent = 0;
    } else {
      messageEl.textContent = '💥 A crab got you! Game over.';
      messageEl.className = 'lose';
      faceBtn.textContent = '💀';
    }
  }

  startGame();
})();
</script>
</body>
</html>
